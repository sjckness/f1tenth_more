<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0;background:#0A0C0F}
a{color:#ECEEF1}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0A0C0F; color: #ECEEF1; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; padding: 54px 16px 10px; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; background: rgba(52,210,123,0.12); font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #34D27B; letter-spacing: 0.06em">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #34D27B"></span>ONLINE</div>
<div style="display: flex; gap: 14px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-variant-numeric: tabular-nums">
<span><span style="color: #9099A6">LAT </span>24 ms</span>
<span><span style="color: #9099A6">BATT </span>11.6 V · 68%</span>
</div>
</div>

<main style="flex: 1; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.01em">Run</h1>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9099A6">ultime 6</span>
</div>

<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{runs}}" as="r" hint-placeholder-count="6">
<li style="background: #13161B; border: 1px solid #262B34; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700">{{r.id}}</span>
<span style="flex: 1; font-size: 13px; color: #9099A6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.mission}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 800; letter-spacing: 0.08em; padding: 4px 8px; border-radius: 6px; color: {{r.color}}; background: {{r.bg}}">{{r.outcome}}</span>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9099A6">{{r.when}} · {{r.dur}}</span>
<a href="#report" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: #1A1E25; color: #ECEEF1; text-decoration: none; font-size: 13px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 12h7M9 16h5"></path></svg>Report</a>
<a href="#video" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 10px; background: #1A1E25; color: #ECEEF1; text-decoration: none; font-size: 13px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5l12 7-12 7z"></path></svg>Video</a>
</div>
</li>
</sc-for>
</ul>
</main>

<div style="padding: 8px 16px 10px">
<button type="button" style="width: 100%; height: 64px; border: 0; border-radius: 16px; background: #D7261E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.14em; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"></path><path d="M12 8v5M12 16.5v.01"></path></svg>EMERGENZA</button>
</div>
<nav aria-label="Sezioni" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #262B34; background: #0E1014; padding: 6px 4px 26px">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; text-decoration: none; color: #9099A6; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 16a8 8 0 1 1 16 0"></path><path d="M12 16l4-5"></path></svg>Cockpit</a>
<a href="Missione.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; text-decoration: none; color: #9099A6; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h12l-2.5 4 2.5 4H5"></path></svg>Missione</a>
<a href="Guida.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; text-decoration: none; color: #9099A6; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2"></circle><path d="M3.5 10.5H10M14 10.5h6.5M12 14v7"></path></svg>Guida</a>
<a href="Telemetria.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; text-decoration: none; color: #9099A6; font-size: 11px; font-weight: 600"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>Telemetria</a>
<a href="Run.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; text-decoration: none; color: #ECEEF1; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M10 9l5 3-5 3z"></path></svg>Run</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var S = {
      OK: ['#34D27B', 'rgba(52,210,123,0.14)'],
      ABORT: ['#F5A524', 'rgba(245,165,36,0.14)'],
      'E-STOP': ['#FF5A50', 'rgba(255,90,80,0.14)']
    };
    var raw = [
      ['R-0148', '2 giri lab_loop → box', 'OK', '20 ott 14:32', '01:24'],
      ['R-0147', '2 giri lab_loop → box', 'ABORT', '20 ott 14:18', '00:37'],
      ['R-0146', 'Guida manuale', 'OK', '20 ott 13:55', '06:10'],
      ['R-0145', 'Slalom coni A–D', 'E-STOP', '20 ott 11:40', '00:19'],
      ['R-0144', '3 giri lab_loop', 'OK', '19 ott 17:02', '02:05'],
      ['R-0143', 'Parcheggio al box', 'OK', '19 ott 16:47', '00:28']
    ];
    var runs = raw.map(function (r) {
      return { id: r[0], mission: r[1], outcome: r[2], when: r[3], dur: r[4], color: S[r[2]][0], bg: S[r[2]][1] };
    });
    return { runs: runs };
  }
}
</script>
</body>
</html>
