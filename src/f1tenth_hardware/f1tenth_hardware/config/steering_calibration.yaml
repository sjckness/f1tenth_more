# Single source of truth for the 5 steering-calibration values shared between
# the real VESC driver (servo_min/servo_max, read by vesc_driver_node) and the
# ackermann->servo conversion (steering_angle_to_servo_offset/
# steering_angle_to_servo_gain_left/_right, read by ackermann_to_vesc_node).
#
# Loaded by vesc.launch.py AFTER vesc.yaml (see that file's own params-file
# order) so these values win over vesc.yaml for the same keys -- vesc.yaml no
# longer carries its own copies of these 5, precisely to avoid two files
# disagreeing about the same value. vesc.yaml keeps everything unrelated
# (ERPM gain, hardware limits, IMU covariance, etc.) plus the singular
# steering_angle_to_servo_gain average used only by vesc_to_odom_node_backup.
#
# Also read directly (not via a running node's ROS params) at startup by
# vesc_tuning's steering_calibration_node.py, and live-overwritten by it
# (atomically) after every confirmed change during calibration -- do not
# hand-edit this file while that node is running; your edit will be clobbered
# on its next write.
#
# IMPORTANT: vesc_driver_node/ackermann_to_vesc_node read all parameters once
# at startup (no dynamic-parameter/set-parameters callback registered in
# either node -- confirmed by reading their source). Neither a hand edit nor
# a live update from steering_calibration_node.py takes effect on an
# already-running driver: restart it to pick up new values. `ros2 param set`
# will not help either, for the same reason.
/**:
  ros__parameters:
    servo_min: 0.15
    servo_max: 0.8318
    # Retuned 2026-09-08 from 50 archived mission bags (825 SLAM-pose
    # intervals, ~2 Hz /slam/pose vs /odom speed and /ackermann_drive
    # command, servo clamp modelled). Bicycle-model fit at L = 0.3302 m
    # gave an actual wheel angle of +2.68 +/- 0.24 deg (95%) at zero
    # command -- the car drifted left with the old 0.4494 centre. New
    # centre = 0.4494 - gain*delta0/gain_error, stable at 0.4873-0.4879
    # across command-latency assumptions of 0-0.25 s and across both
    # candidate wheelbases (0.3302 / 0.305). Per-bag spread sd 1.23 deg
    # over 47 bags, SEM 0.18 deg.
    steering_angle_to_servo_offset: 0.4874
    # Placeholder until retuned -- see vesc_tuning's steering_calibration_node.py
    # Mode 3 (gain), which tunes gain_left and gain_right independently.
    steering_angle_to_servo_gain_left: -1.2135
    steering_angle_to_servo_gain_right: -1.2135
