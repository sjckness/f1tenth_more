# Maps a short model name (llm.launch.py's `model` launch argument) to the llama-server
# invocation for it. model_path is expanded with os.path.expanduser() at launch time, so
# ~ is safe to use here. extra_args are appended verbatim after -m/--port -- anything the
# real llama-server CLI accepts (see `llama-server --help`) beyond those two flags, e.g.
# -ngl.
#
# qwen_mpc_pruned (v2_MPCLLM_structpruned_10-q5_k_m.gguf, port 8082) used to
# have an entry here for llm_mpc_tuner_node, which has since been removed
# outright (see git history) -- this file's own port numbering below still
# starts at 8083, one past that entry's old port, for continuity/no-collision
# with anyone who still has a stale launch invocation cached. The .gguf file
# itself was deliberately NOT deleted from disk (see git history for that
# pass's own reasoning: unused model weights are harmless to leave behind,
# deleting them isn't easily undone) -- it's just unregistered here now.

# Stock (unpruned) Qwen2.5-3B-Instruct, q5_k_m -- pulled from
# https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF
# (qwen2.5-3b-instruct-q5_k_m.gguf, ~2.3GB) for llm_planner_node's own
# interrogation (see interrogations.yaml's `planner` entry's default_model).
# Deliberately NOT one of the structprune-family models already sitting
# alongside it in this same directory (v2_decisionLLM_structpruned_20-*,
# also qwen2/Qwen2.5-3B-derived, named for a decision-type task) -- a real,
# already-available candidate that was flagged and explicitly passed over
# in favor of a stock download for this pass.
qwen25_3b_instruct:
  model_path: ~/projects/llm/models/qwen2.5-3b-instruct-q5_k_m.gguf
  port: 8083
  extra_args: ["-ngl", "999"]
# LLM2 (two-llm-arch): the second llama-server, started by llm2.launch.py for
# llm2_mpc_param_node (interrogations.yaml's llm2_mpc_params). THE SAME FILE
# as qwen25_3b_instruct above -- 2438740384 bytes, sha256
# 2c63dde5f2c9ab1fd64d47dee2d34dade6ba9ff62442d1d20b5342310c982081, identical
# on the Orin, on linus and on Qwen/Qwen2.5-3B-Instruct-GGUF -- so nothing new
# to download where LLM1 already runs. Its own entry because the second
# server's workload differs: one request in flight at a time (the node never
# overlaps them) and a prompt of a few hundred tokens, so ONE slot of 4096
# tokens instead of the default 4 slots sharing 32768. One slot also keeps
# the fixed prompt prefix cached between requests (cache_prompt).
# port: NOT read by llm2.launch.py, which uses its own llm2_port launch
# argument (default 8084; 8083 is LLM1's). Set to the same value so the entry
# is still consistent if it is ever served through llm.launch.py.
qwen2.5-3b-instruct-q5km:
  model_path: ~/projects/llm/models/qwen2.5-3b-instruct-q5_k_m.gguf
  port: 8084
  extra_args: ["-ngl", "999", "-np", "1", "-c", "4096"]
