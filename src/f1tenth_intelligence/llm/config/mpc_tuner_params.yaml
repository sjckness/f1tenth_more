# Params for llm_mpc_tuner_node, loaded by launch/llm.launch.py per
# interrogations.yaml's mpc_tuner entry. mpc_url and target_node are deliberately NOT
# set here -- mpc_url is built from models.yaml's `port` for the selected model, and
# target_node comes from f1tenth_params/config/stack_params.yaml's mpc_node_name --
# both injected by llm.launch.py at launch time, so each has exactly one source of
# truth, not two.
/**:
  ros__parameters:
    odom_topic: /odom
    stop_topic: /teleop
    update_frequency: 1.0
    llm_timeout_sec: 30.0
    slow_target_velocity: -0.5
    fast_target_velocity: -1.0
