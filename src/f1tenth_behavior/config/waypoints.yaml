# Waypoint list for behavior_executor_node's NavigateThroughPoses goal, loaded once at
# startup (see loadWaypoints() in src/behavior_executor_node.cpp) -- not per-tick data.
# Flat parallel arrays because ROS 2 params don't support a list of structs. waypoint_yaw
# may be omitted (defaults to 0.0 for every pose) but if given must be the same length
# as waypoint_x/waypoint_y.
#
# PLACEHOLDER: replace with real waypoints for your map (f1tenth_navigation's
# track_bw.yaml) before enabling use_behavior_tree.
behavior_executor_node:
  ros__parameters:
    waypoint_frame: map
    waypoint_x: [1.0, 2.0, 3.0]
    waypoint_y: [0.5, 0.8, 1.1]
    waypoint_yaw: [0.0, 0.1, 0.2]
