# Hydra config, profile workstation_full: every layer at the finest settings the RTX 4090 /
# 512 GB workstation affords. Built from Hydra's own indoor RGB-D configs (config/datasets/
# habitat.yaml, uhumans2.yaml) and Hydra-ROS's zed2i.yaml, keys unchanged; only values differ.
# hydra.launch.py adds the input block (topics, range, extrinsics), the frames, the label space
# and the log path on the command line (f1tenth_hydra/hydra_args.py).
---
map_window:
  type: spatial
  max_radius_m: 15.0               # habitat 8.0: keep 15 m of map in the active window
active_window:
  full_update_separation_s: 0.2    # uhumans2
  volumetric_map:
    voxels_per_side: 16
    voxel_size: 0.05               # habitat 0.1: max quality
    truncation_distance: 0.15      # 3 voxels, as 0.3 at 0.1
  tsdf:
    semantic_integrator:
      type: MLESemanticIntegrator  # robust to network noise; exact with GT labels too
frontend:
  type: GraphBuilder
  pgmo:
    time_horizon: 15.0
    d_graph_resolution: 1.5        # habitat 2.5: denser deformation graph
    mesh_resolution: 0.005
  objects:
    min_cluster_size: 80           # 40 at 0.1 m; 4x the surface vertices at 0.05 m, x2 margin
    cluster_tolerance: 0.15        # 0.25 at 0.1 m voxels
    bounding_box_type: AABB
  surface_places:                  # MESH_PLACES layer (zed2i.yaml)
    type: place_2d
    prefix: P
    pure_final_place_size: 3
    enable_place_purity: false
    impure_final_place_size: 1
    cluster_tolerance: 0.3
    min_cluster_size: 50
    max_cluster_size: 100000
    min_final_place_points: 10
    place_max_neighbor_z_diff: 0.5
    place_overlap_threshold: 0.0
  freespace_places:                # PLACES layer (GVD): rooms are found on it
    type: gvd
    filter_places: true
    min_places_component_size: 3
    filter_ground: false
    gvd:
      max_distance_m: 4.5
      min_distance_m: 0.2
      min_diff_m: 0.1
      voronoi_config:
        mode: L1_THEN_ANGLE
        min_distance_m: 0.30
        parent_l1_separation: 20
        parent_cos_angle_separation: 0.2
    graph:
      type: CompressionGraphExtractor
      compression_distance_m: 1.0
      min_node_distance_m: 0.4
      min_edge_distance_m: 0.2
      node_merge_distance_m: 0.5
      add_heuristic_edges: true
      add_overlap_edges: false
      add_freespace_edges: true
      freespace_edges:
        num_nodes_to_check: 10
        num_neighbors_to_find: 2
        min_clearance_m: 0.2
    tsdf_interpolator:
      type: downsample
      ratio: 2                     # GVD at 0.10 m on the 0.05 m TSDF (habitat: 0.2 on 0.1)
  use_frontiers: false
backend:
  type: BackendModule
  # RosBackendPublisher (hydra_ros), read from this block:
  serialize_dsg_mesh: false        # the graph topic stays small; the mesh has its own topic
  publish_mesh: true               # /hydra/backend/dsg_mesh
  min_dsg_separation_s: 0.5        # graph at <= 2 Hz
  min_mesh_separation_s: 2.0
  publish_backend_tf: true         # hydra.launch.py forces false with pose_source:=stack_tf
  add_places_to_deformation_graph: true
  optimize_on_lc: true
  enable_node_merging: true
  update_functors:
    agents: {type: UpdateAgentsFunctor}
    objects: {type: UpdateObjectsFunctor}
    surface_places: {type: Update2dPlacesFunctor, min_size: 3}
    places:
      type: UpdatePlacesFunctor
      pos_threshold_m: 0.3
      distance_tolerance_m: 0.2
    rooms:
      type: UpdateRoomsFunctor
      room_finder:
        min_dilation_m: 0.5
        max_dilation_m: 1.2
        min_component_size: 10
        min_room_size: 10
        dilation_threshold_mode: PLATEAU
        min_lifetime_length_m: 0.1
        plateau_ratio: 0.25
        clustering_mode: NEIGHBORS
        dilation_diff_threshold_m: -1.0
    buildings: {type: UpdateBuildingsFunctor}
  pgmo:
    run_mode: FULL                 # required by Hydra
    embed_trajectory_delta_t: 5.0
    num_interp_pts: 3
    interp_horizon: 10.0
    add_initial_prior: true
    optimizer:
      type: KimeraRpgoOptimizer
      solver: LM
      gnc:
        inlier_probability: 0.9
        mu_step: 1.6
        max_iterations: 100
    covariance:
      odom: 1.0e-02
      loop_close: 5.0e-02
      sg_loop_close: 1.0e-01
      prior: 1.0e-02
      mesh_mesh: 1.0e-02
      pose_mesh: 1.0e-02
      place_mesh: 1.0e-02
      place_edge: 1.0e-02
      place_merge: 10.0
      object_merge: 10.0
