[package]
name = "f1tenth_proximity_guard"
version = "0.1.0"
description = "Front-proximity guard (rclrs): shadow or active e-stop on the safety_stop mux lane"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[[bin]]
name = "proximity_guard_node"
path = "src/main.rs"

# tools/rust_parity/proximity: the same decision on recorded/synthetic cases.
[[bin]]
name = "proximity_guard_replay"
path = "src/bin/proximity_guard_replay.rs"

[dependencies]
# See ../Cargo.toml for why exactly 0.7.0.
rclrs = "=0.7.0"
# Message crates: generated by rosidl_generator_rs into share/<pkg>/rust,
# patched in by colcon-ros-cargo (.cargo/config.toml); "*" is the convention.
builtin_interfaces = "*"
std_msgs = "*"
sensor_msgs = "*"
tf2_msgs = "*"
geometry_msgs = "*"
ackermann_msgs = "*"
diagnostic_msgs = "*"
# ros2-rust/ros2_rust#557: rclrs's vendored test crates link these two
# packages' typesupport libraries; declaring them makes colcon resolve them.
example_interfaces = "*"
test_msgs = "*"
# Parity harness case files (JSON lines).
serde = { version = "1", features = ["derive"] }
# float_roundtrip: correctly rounded float parsing. The default parser can be
# 1 ulp off, which the parity harness would read as an extraction difference.
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
