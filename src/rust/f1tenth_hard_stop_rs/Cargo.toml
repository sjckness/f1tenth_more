[package]
name = "f1tenth_hard_stop_rs"
version = "0.1.0"
description = "hard_stop_node in Rust (rclrs): the last-resort LiDAR stop on the safety_stop mux lane, a port of f1tenth_control's hard_stop"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[[bin]]
name = "hard_stop_node"
path = "src/main.rs"

# tools/rust_parity/hard_stop: the same decision and node logic on recorded
# and synthetic event sequences.
[[bin]]
name = "hard_stop_replay"
path = "src/bin/hard_stop_replay.rs"

[dependencies]
# See ../Cargo.toml for why exactly 0.7.0.
rclrs = "=0.7.0"
# Message crates: generated by rosidl_generator_rs into share/<pkg>/rust,
# patched in by colcon-ros-cargo (.cargo/config.toml); "*" is the convention.
builtin_interfaces = "*"
std_msgs = "*"
sensor_msgs = "*"
ackermann_msgs = "*"
# ros2-rust/ros2_rust#557: rclrs's vendored test crates link these two
# packages' typesupport libraries; declaring them makes colcon resolve them.
example_interfaces = "*"
test_msgs = "*"
# Parity harness protocol (JSON lines).
# float_roundtrip: correctly rounded float parsing. The default parser can be
# 1 ulp off, which the parity harness would read as a decision difference.
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
