[package]
name = "f1tenth_wall_tracker_core"
version = "0.1.0"
description = "lidar_front_wall_node's multi-wall tracker and per-cycle wall fusion in Rust (no ROS): a C-ABI library f1tenth_perception loads with ctypes"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

# cdylib: cargo-ament-build installs lib<package>.so into
# install/f1tenth_wall_tracker_core/lib/f1tenth_wall_tracker_core/, where
# f1tenth_perception's wall_tracker_native.py finds it through ament_index.
# rlib: the unit tests link it directly.
[lib]
crate-type = ["cdylib", "rlib"]

# No dependencies on purpose: no ROS, no numerics crate. The arithmetic is the
# numpy / CPython / LAPACK reproduction in src/pyc.rs and src/linalg.rs;
# sin/cos/atan2/hypot/pow/exp come from the platform libm, the same one numpy
# and CPython call.
[dependencies]

[lints.rust]
# deny, not forbid: src/ffi.rs is the one module allowed to use unsafe (raw
# pointers from ctypes), and a crate-level forbid cannot be relaxed there.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
