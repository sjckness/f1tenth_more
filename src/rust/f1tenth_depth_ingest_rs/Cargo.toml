[package]
name = "f1tenth_depth_ingest_rs"
version = "0.1.0"
description = "Depth ingest node (rclrs): reads the ZED depth, camera_info, masks and detections once and publishes the reductions detection_3d_node and front_clearance_node need (depth_source:=ingest)"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

# The library is the node's logic without ROS (the decode, the medians, the
# synchronizer, the ROI): rlib for the node binary and the unit tests, cdylib
# for f1tenth_perception's depth_ingest_native.py (ctypes: the parity harness
# and the in-process test hook). cargo-ament-build installs
# libf1tenth_depth_ingest_rs.so next to the binary, in
# install/f1tenth_depth_ingest_rs/lib/f1tenth_depth_ingest_rs/. The library
# code uses no rclrs and no message crate, so the .so links neither.
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "depth_ingest_node"
path = "src/main.rs"

[dependencies]
# See ../Cargo.toml for why exactly 0.7.0.
rclrs = "=0.7.0"
# Message crates: generated by rosidl_generator_rs into share/<pkg>/rust,
# patched in by colcon-ros-cargo (.cargo/config.toml); "*" is the convention.
rosidl_runtime_rs = "0.6"
builtin_interfaces = "*"
std_msgs = "*"
sensor_msgs = "*"
vision_msgs = "*"
f1tenth_messages = "*"
# ros2-rust/ros2_rust#557: rclrs's vendored test crates link these two
# packages' typesupport libraries; declaring them makes colcon resolve them.
example_interfaces = "*"
test_msgs = "*"

[lints.rust]
# deny, not forbid: src/ffi.rs is the one module allowed to use unsafe (raw
# pointers from ctypes), and a crate-level forbid cannot be relaxed there.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
