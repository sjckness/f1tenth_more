[develop]
script_dir=$base/lib/f1tenth_logger
[install]
install_scripts=$base/lib/f1tenth_logger

[tool:pytest]
# Collect from test/ only. launch/test_campaign_logger.launch.py matches
# pytest's test_*.py pattern, and launch_testing's collection hook tries to
# import it as a test module (ModuleNotFoundError: test_campaign_logger),
# failing the whole package under colcon test.
testpaths = test
