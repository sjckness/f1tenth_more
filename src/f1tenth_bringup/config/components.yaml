# Structural registry for component_supervisor_node (see f1tenth_bringup/
# f1tenth_bringup/component_supervisor_node.py): WHAT each named component runs, as
# one or more `ros2 launch <package> <launch_file> [args...]` commands. Each
# component's whole list of launches is restarted together as one unit.
#
# WHICH components auto-start at supervisor startup, and whether `navigation`/
# `behavior`/`intelligence` get modified or skipped, is NOT encoded here --
# component_supervisor_node.py decides that itself by reading the same 4
# stack-wide branching values from f1tenth_params/config/stack_params.yaml that
# stack_bringup.launch.py uses (enable_nav2, use_behavior_tree among them --
# `intelligence` is the one exception: component-auto-start pass, gated on
# component_supervisor_node's own enable_intelligence declared parameter
# instead, a real CLI-overridable arg like `calibration`, not one of those
# baked-in-at-parse-time stack-wide values -- see that node's own module
# docstring/stack_params.yaml's enable_intelligence comment for why), so
# there is exactly one place those defaults live. See that node's module
# docstring for the exact mapping.
#
# calibrate_hardware is registered here (a valid, restartable component_name) but
# never auto-started -- it's an explicit, on-demand recalibration action, not a
# steady-state component. See its own args below and component_supervisor_node.py's
# docstring for the follow-up workflow (restart localization + navigation after it
# completes).
#
# hardware's calibration arg is deliberately ABSENT from its args below (as of
# the calibration-single-source-of-truth pass) -- it used to be hardcoded here
# ('true', as of the earlier automatic-startup-calibration pass), which meant
# f1tenth_params/config/stack_params.yaml's own `calibration` key was a lie: no
# launch arg or param actually read it for this path, so there was no live way
# to get calibration:=false through supervisor_bringup.launch.py at all -- only
# hand-editing this file. Fixed by making stack_params.yaml's `calibration` key
# the ONLY declaration: component_supervisor_node.py now declare_parameter()s
# 'calibration' (wired from supervisor_bringup.launch.py's own `calibration`
# launch argument, defaulting from that same stack_params.yaml key) and injects
# it into this entry's args dict at runtime, before 'hardware' ever launches --
# see that node's __init__ and _hardware_will_calibrate()'s own docstring. A
# calibration failure still falls back silently (vesc.yaml left untouched)
# rather than blocking startup -- see f1tenth_hardware/launch/vesc.launch.py's
# own module docstring for the full sequencing. calibrate_hardware below is
# untouched by this -- it's a deliberate, explicit, always-calibrate action.
#
# release_downstream: 'false' here for the same reason calibrate_hardware already
# had it below: localization/navigation are THIS supervisor's own independently-
# tracked components (see those entries further down), not nested includes of
# vesc.launch.py's own launch tree -- without this override, vesc.launch.py's
# calibration:=true path defaults release_downstream to true and would, once
# calibration finished, ALSO include ekf.launch.py/navigation.launch.py itself,
# duplicating (two ekf_node instances, two nav stacks) what component_supervisor_
# node already separately auto-starts. Missed when calibration was first flipped
# to 'true' here -- caught before it manifested (the run that surfaced it was
# interrupted before vesc.launch.py's driver group v2 ever came up).

components:
  hardware:
    - package: f1tenth_hardware
      launch_file: vesc.launch.py
      args:
        release_downstream: 'false'

  calibrate_hardware:
    - package: f1tenth_hardware
      launch_file: vesc.launch.py
      args:
        calibration: 'true'
        release_downstream: 'false'

  localization:
    - package: f1tenth_localization
      launch_file: localization.launch.py

  perception:
    - package: f1tenth_perception
      launch_file: camera.launch.py
    # lidar.launch.py runs urg_node, the only /scan publisher, which the e-stop
    # (IsProximityTooClose) reads. Everything in this component restarts
    # together, so do not add /scan consumers here -- see lidar_front_wall below.
    - package: f1tenth_perception
      launch_file: lidar.launch.py
    - package: f1tenth_perception
      launch_file: detection.launch.py

  # MUST stay its own component. component_supervisor_node restarts a component
  # by SIGINTing every launch file registered under it, so if this file sat under
  # `perception` above -- or its node inside lidar.launch.py -- any restart of the
  # wall estimator (crash loop, retune, routine restart) would restart urg_node
  # too and leave the e-stop without /scan for the duration. See
  # lidar_front_wall.launch.py's module docstring. Enforced by
  # f1tenth_bringup/test/test_lidar_front_wall_component.py.
  lidar_front_wall:
    - package: f1tenth_perception
      launch_file: lidar_front_wall.launch.py

  # MUST stay its own component, for the identical reason as lidar_front_wall
  # above and MORE so: this node reads /scan, owns glass_detect.py in-process,
  # is brand new, and is the one whose gates get retuned in the first powered
  # session -- i.e. the one most likely to be restarted. Restarting it under
  # `perception` would take urg_node, and therefore the e-stop's only /scan,
  # down with it every time. See f1tenth_perception/launch/wall_distance.
  # launch.py's module docstring. Enforced by f1tenth_bringup/test/
  # test_wall_distance_component.py.
  wall_distance:
    - package: f1tenth_perception
      launch_file: wall_distance.launch.py

  # Registered as of the d_wall pass. It had an entry point and a launch file
  # since it was written but appeared in NO component and in no other launch
  # file, so it had never run on the car at all -- and registering it does not
  # change that: it still has not. Treat its first powered run as validation,
  # not a formality (f1tenth_perception/README.md's UNVALIDATED section).
  #
  # Its own component for the same /scan reason as the two above. NOTE its
  # value is rear-axle ARC LENGTH to body contact -- metres of travel, not a
  # perpendicular gap and not a sensor range. Nothing subscribes to
  # /perception/swept_clearance yet; anything that starts to must read
  # swept_corridor.py's module docstring first.
  swept_clearance:
    - package: f1tenth_perception
      launch_file: swept_clearance.launch.py

  # In _ALWAYS_AUTO_START: starts with the stack (it was on-demand until the
  # 2026-09-21 campaign session ran without it). A data source for the
  # test-campaign logger (/obstacle_clearance, contact events on
  # /safety/event); nothing controls off it. Its own component for the same
  # /scan reason as the three above. Enforced by f1tenth_bringup/test/
  # test_obstacle_clearance_component.py.
  obstacle_clearance:
    - package: f1tenth_perception
      launch_file: obstacle_clearance.launch.py

  control:
    - package: f1tenth_control
      launch_file: ackermann_mux.launch.py

  navigation:
    - package: f1tenth_navigation
      launch_file: navigation.launch.py

  slam:
    - package: f1tenth_navigation
      launch_file: slam.launch.py
    - package: f1tenth_costmap
      launch_file: costmap.launch.py

  behavior:
    - package: f1tenth_behavior
      launch_file: behavior_bringup.launch.py

  diagnostics:
    - package: f1tenth_diagnostics
      launch_file: system_observer.launch.py
    - package: f1tenth_diagnostics
      launch_file: diagnostics_server.launch.py
    - package: f1tenth_logger
      launch_file: mission_logger.launch.py

  intelligence:
    # No args override here (drop-the-start_server-override pass) --
    # llm.launch.py's own start_server launch-arg now itself defaults 'true'
    # (see stack_params.yaml's start_server comment for why: this component
    # is llm.launch.py's only remaining caller, and its whole point is
    # starting llama-server automatically, so an explicit override here is no
    # longer needed to make that happen). model/interrogation are also NOT
    # overridden here -- both already default correctly (interrogation ->
    # planner, model -> '' auto-selecting planner's own default_model,
    # qwen25_3b_instruct -- see llm.launch.py's own model/interrogation
    # pairing fix) with only one interrogation registered today.
    - package: llm
      launch_file: llm.launch.py

  dev_tools:
    - package: f1tenth_bringup
      launch_file: foxglove_bridge.launch.py

  startup_sequence:
    - package: f1tenth_bringup
      launch_file: startup_sequence.launch.py

# ------------------------------------------------------------------------------
# Topic-liveness watchdog (fix batch 5, backlog H1). See f1tenth_bringup/
# topic_watchdog.py's module docstring for the schema and the verdict rules, and
# component_supervisor_node.py's "Topic-liveness watchdog" paragraph for how the
# supervisor runs it. Every component above is either in `health:` or in
# `unwatched:` with a reason -- test_component_health_config.py enforces it, so a
# new component cannot be added without stating how its liveness is judged.
#
# Each check is marked in its comment:
#   INPUT-PROVING  a message (or the field named in `expect`, or the message
#                  rate) exists only because the node received its input
#                  recently -- a node cut off from its input fails the check;
#   INPUT-PROVING AT START  the node publishes only once it has received its
#                  input at least once (a subscription that never matched is
#                  caught), then from cache (a later loss is not);
#   OUTPUT-ONLY    published on a timer whatever the inputs do: proves the node
#                  runs and its publisher reaches the supervisor, nothing more.
# `when_fresh` names the input(s) the check is judged against: while an input
# is stale (an upstream outage), the check is skipped, not failed.
#
# max_age_sec is about 5x the topic's nominal period, at least 0.5 s.
# ------------------------------------------------------------------------------

health_topic_types:
  /odom: nav_msgs/msg/Odometry
  /sensors/core: vesc_msgs/msg/VescStateStamped
  /scan: sensor_msgs/msg/LaserScan
  /odometry/filtered: nav_msgs/msg/Odometry
  /ekf_global/odometry/filtered: nav_msgs/msg/Odometry
  /joint_states: sensor_msgs/msg/JointState
  /slam/map: nav_msgs/msg/OccupancyGrid
  /costmap/front_clearance: std_msgs/msg/Float32
  /perception/lidar_front_wall: f1tenth_messages/msg/WallLineFit
  /obstacle_clearance: std_msgs/msg/Float32
  /perception/swept_clearance/lidar: std_msgs/msg/Float32
  /perception/d_wall/segment: f1tenth_messages/msg/WallSegment
  /drive: ackermann_msgs/msg/AckermannDriveStamped
  /ackermann_drive: ackermann_msgs/msg/AckermannDriveStamped
  /mpc/input_status: diagnostic_msgs/msg/DiagnosticStatus
  /behavior/tree_status: f1tenth_messages/msg/BehaviorTreeStatus
  /diagnostics/system_status: f1tenth_messages/msg/SystemStatus
  /diagnostics/battery_status: f1tenth_messages/msg/BatteryStatus

health:
  # alert only: restarting 'hardware' restarts the VESC driver (the car's
  # motor and steering) mid-run. The crash path already restarts it if the
  # process dies. Not running in sim mode (sim_hardware_tf.launch.py instead).
  hardware:
    action: alert
    checks:
      # OUTPUT-ONLY with respect to the VESC serial link: the driver's own output.
      - {topic: /sensors/core, max_age_sec: 0.5, launch_file: vesc.launch.py}
      # INPUT-PROVING: vesc_to_odom publishes one /odom per /sensors/core message.
      - {topic: /odom, max_age_sec: 0.5, launch_file: vesc.launch.py,
         when_fresh: {/sensors/core: 0.5}}

  # alert only: restarting 'perception' restarts urg_node, the e-stop's only
  # /scan (see the comments on the components above). The camera is not
  # watched: subscribing to an image stream costs a full copy per frame.
  perception:
    action: alert
    checks:
      # OUTPUT-ONLY with respect to the lidar link: the driver's own output.
      - {topic: /scan, max_age_sec: 0.5, launch_file: lidar.launch.py}

  localization:
    checks:
      # INPUT-PROVING via the rate. robot_localization publishes nothing
      # before its first measurement (a subscription that never matched:
      # caught by max_age_sec), and after that keeps predicting without
      # input -- measured in fix batch 5 with /odom cut: /odometry/filtered
      # 48 -> about 9 Hz, /ekf_global 48 -> about 16 Hz, a new header.stamp on
      # every message either way. So the receipt rate is the signal: below
      # 30 Hz over 2 s while /odom is fresh = the EKF is not getting it.
      - {topic: /odometry/filtered, max_age_sec: 0.5, min_rate_hz: 30,
         when_fresh: {/odom: 0.5}}
      - {topic: /ekf_global/odometry/filtered, max_age_sec: 0.5, min_rate_hz: 30,
         when_fresh: {/odom: 0.5}}
      # INPUT-PROVING AT START: joint_state_publisher publishes nothing until it
      # has /robot_description (fix batch 4 baseline run 4 never got it).
      - {topic: /joint_states, max_age_sec: 1.0}

  slam:
    grace_sec: 30
    checks:
      # INPUT-PROVING AT START, judged `once`: slam_toolbox publishes a map
      # only once it is ACTIVE and has processed a scan -- the lifecycle loss
      # of fix batch 4 never produces one. Not an age: before every publish
      # it rebuilds the whole grid from every scan so far, under the mapper
      # lock, so the nominal 5 s map_update_interval stretches as the session
      # grows (18.5 s after 2 min in fix batch 5's live test, and it restarted
      # a healthy slam). /slam/pose is NOT used either: slam_toolbox only
      # publishes it after the car has moved minimum_travel_distance.
      - {topic: /slam/map, once: true, launch_file: slam.launch.py,
         when_fresh: {/scan: 0.5}}
      # INPUT-PROVING AT START: costmap_boundary_node withholds front_clearance
      # until it has both a map and a pose, then republishes from cache at
      # 20 Hz. Judged once a map exists at all (.inf: received at least once).
      - {topic: /costmap/front_clearance, max_age_sec: 0.5, launch_file: costmap.launch.py,
         when_fresh: {/slam/map: .inf, /ekf_global/odometry/filtered: 0.5}}

  lidar_front_wall:
    enabled_if: {use_lidar: true}
    checks:
      # INPUT-PROVING: one fit per /scan message.
      - {topic: /perception/lidar_front_wall, max_age_sec: 0.5, when_fresh: {/scan: 0.5}}

  obstacle_clearance:
    enabled_if: {use_lidar: true}
    checks:
      # INPUT-PROVING: one clearance per /scan message.
      - {topic: /obstacle_clearance, max_age_sec: 0.5, when_fresh: {/scan: 0.5}}

  swept_clearance:
    enabled_if: {use_lidar: true}
    checks:
      # INPUT-PROVING: one lidar clearance per /scan message.
      - {topic: /perception/swept_clearance/lidar, max_age_sec: 0.5, when_fresh: {/scan: 0.5}}

  wall_distance:
    enabled_if: {use_lidar: true}
    checks:
      # OUTPUT-ONLY: published every 10 Hz tick whatever arrived; no field
      # tells "no scan" apart from "no wall in view".
      - {topic: /perception/d_wall/segment, max_age_sec: 0.5}

  control:
    checks:
      # INPUT-PROVING: ackermann_mux republishes each message of its active
      # input lane; with no lane active it publishes nothing.
      - {topic: /ackermann_drive, max_age_sec: 0.5, when_fresh: {/drive: 0.5}}

  navigation:
    enabled_if: {enable_nav2: false}
    checks:
      # OUTPUT-ONLY: mpc_corr's control loop runs (published at 2 Hz from it).
      - {topic: /mpc/input_status, max_age_sec: 1.5}
      # INPUT-PROVING: level is OK only while mpc_corr's own odometry is fresh
      # (its odom_stale_timeout_sec, 0.5 s). /drive is NOT a usable check: it
      # is published every tick with or without odometry, which is exactly
      # how fix batch 3's isolated mpc_corr looked healthy.
      - {topic: /mpc/input_status, max_age_sec: 1.5, expect: {level: [0]},
         when_fresh: {/odometry/filtered: 0.5}}

  behavior:
    checks:
      # OUTPUT-ONLY: one status per BT tick, whatever its inputs do.
      - {topic: /behavior/tree_status, max_age_sec: 0.5}

  diagnostics:
    checks:
      # OUTPUT-ONLY: system_observer reads /proc and jtop, no ROS input.
      - {topic: /diagnostics/system_status, max_age_sec: 5.0,
         launch_file: system_observer.launch.py}
      # OUTPUT-ONLY: diagnostics_server's 2 Hz battery tick.
      - {topic: /diagnostics/battery_status, max_age_sec: 1.5,
         launch_file: diagnostics_server.launch.py}
      # INPUT-PROVING: has_data is true only if /sensors/core samples arrived
      # since the previous tick.
      - {topic: /diagnostics/battery_status, max_age_sec: 1.5,
         launch_file: diagnostics_server.launch.py, expect: {has_data: [true]},
         when_fresh: {/sensors/core: 0.5}}

unwatched:
  calibrate_hardware: on demand, runs for about 2 minutes and exits.
  startup_sequence: on demand, a one-off steering sweep.
  intelligence: llama-server, not a ROS node; nothing to watch on the graph.
  dev_tools: foxglove_bridge is a super client and serves the operator; its failure is visible to the operator directly.
