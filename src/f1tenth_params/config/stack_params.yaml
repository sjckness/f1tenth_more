# ============================================================
# d_wall corridor correction (mpc_controller/MPC_corr.py)
# ============================================================
# Consumed by: MPC_corr.py's declare_parameter() defaults (get_value), no
# launch arg -- edit here and relaunch, the same convention the corr_wall_turn_*
# and wall_* keys use.
#
# WHERE THE CORRECTION LANDS, AND WHY THERE. wall_distance_node publishes a
# heading correction on /perception/d_wall/psi_correction; mpc_corr adds it to
# psi_base in build_straight_corridor's drive/"straight" branch and NOWHERE
# else. Option B in docs/wall_turn_investigation.md. The three findings behind
# that choice, short form:
#
#   1. The MPC does not own a turn's exit heading -- f1tenth_behavior's
#      orientation_delta stop_condition ends the move at 90 deg of accumulated
#      yaw, so the exit heading is move_start + 90 deg whatever the corridor
#      asked for. Only the PATH to those 90 degrees is controllable.
#   2. So injecting at dpsi_this was rejected: it is bounded by
#      min(|dpsi_rem|, ...) in wall_turn.py, so its authority reaches zero
#      exactly at turn exit, and the ratchet suppresses the sign that helps.
#   3. The post-exit straight corridor is genuinely separate -- its own psiEnd,
#      psiRefTurn None, no ratchet, no horizon clip. That is the seam.
#
# IT DOES NOTHING UNTIL A MISSION HAS A MOVE AFTER THE TURN. Every wall_turn
# mission in the repo sets terminal: true on the turn, and on a terminal move
# AdvanceMove publishes /mpc/hold, which returns from control_loop BEFORE the
# corridor rebuild -- so no post-exit corridor is ever built.
# missions/wall_turn_then_straight.json is the one that exercises this.
corr_d_wall_correction_enable:
  default: true
  description: "Apply wall_distance_node's heading correction to the straight drive corridor's psi_base. false: mpc_corr still SUBSCRIBES and still logs, so a run is analysable for what the correction would have done, but psiEnd is byte-identical to before the node existed. The subscription is unconditional on purpose -- Stage 4 of docs/bringup_checklist.md records a real turn with the correction observed and not applied, and that needs the trace on the wire. NOTE the node's own wall_distance_max_psi_correction: 0.0 achieves the same thing one node earlier; this flag is the mpc_corr-side kill switch for when the node cannot be relaunched."
corr_d_wall_max_age_sec:
  default: 0.5
  # SYNTHETIC -- retune on hardware
  description: "Age [s] past which the correction is treated as ABSENT, i.e. zero -- never as the last value still standing. A dead or restarted wall_distance_node must decay this branch to the geometry it had before the node existed, which is the safe direction by construction; the natural implementation holds the last value and that is the bug. 0.5 s is five of the node's 10 Hz ticks, matching corr_wall_turn_front_distance_max_age_sec's own budget for the same class of failure. SYNTHETIC."

# ---- wall_distance geometric candidate source ----------------------------
# WHY THERE IS A SECOND SOURCE AT ALL, and it is not an optimisation.
# glass_detect.detect() is not a wall fitter and was never meant to be: it
# returns a surface only when that surface carries TRANSPARENCY evidence,
# because its job is the marking-only glass observation a costmap must never
# clear. It begins with `if not voids: return []`, so an ordinary opaque wall
# produces no candidate at all.
#
# MEASURED ON THE ARCHIVE. Over 40 real scans from
# 2026-09-10T13-34-09_mission-wall_turn (office corridor, opaque walls)
# glass_detect found 690 voids and 160 candidates but ACCEPTED ONLY 4 -- about
# one per ten scans, against a bar of wall_distance_persistence_hits *
# wall_distance_geometry_only_multiplier = 6 hits in a window of 8. It can
# never confirm at that rate, and wall_distance_node tracked nothing for the
# entire run. A plain MSAC over the same first scan found a 5.29 m wall with
# 220 inliers at 2.48 m immediately.
#
# So both sources run every scan, which is exactly what WallDistance.msg's
# provenance field has always distinguished: GLASS_CONFIRMED vs GEOMETRIC.
# Glass-confirmed is strictly better where it exists -- it survives incidence
# angles a geometric fit never sees -- but on this car in this building it is
# the exception, not the rule.
wall_distance_geom_enable:
  default: true
  description: "Run the geometric (non-glass) line fit alongside glass_detect every scan. false: glass-confirmed surfaces only, which on measured archive data means NO TRACK AT ALL on an ordinary opaque wall -- see the note above. Set false only to reproduce that, or once glass detection is proven at range."
wall_distance_geom_min_inliers:
  default: 40
  # SYNTHETIC -- retune on hardware
  description: "Fewest inliers a geometric line needs. A short cluster fits any line you like: a doorframe or a box corner makes a perfect two-point wall. 40 is well under the 220 the archive's real corridor wall produced and well over the handful a corner does. SYNTHETIC."
wall_distance_geom_min_span_m:
  default: 1.0
  # SYNTHETIC -- retune on hardware
  description: "Shortest contiguous extent [m] along a geometric line, measured mullion-tolerantly (a 0.6 m gap does not end a surface). Partition scale, so furniture cannot qualify. The archive's corridor wall spanned 5.29 m. SYNTHETIC."
wall_distance_geom_min_distance_m:
  default: 0.5
  # SYNTHETIC -- retune on hardware
  description: "Nearest perpendicular distance [m] from base_link to an accepted geometric line. A line passing through the car's own footprint is the car, or near-field clutter, not a wall. THIS CANNOT BE DONE BY FILTERING RETURNS BY RANGE: the archive produced an oblique line through points all beyond glass_min_range_m (0.8) that still passed 0.62 m from the origin. The body reaches 0.443 m ahead of the axle. SYNTHETIC."
wall_distance_geom_max_candidates:
  default: 4
  # SYNTHETIC -- retune on hardware
  description: "Most geometric lines extracted from one scan, sequentially. Bounds the per-scan cost; 4 covers a corridor's two side walls plus an end wall plus one spare. SYNTHETIC."
wall_distance_geom_inlier_distance_m:
  default: 0.03
  # real, measured on ~58k archived scans
  description: "Perpendicular distance [m] within which a return is an inlier of a geometric line. 0.03 is this LiDAR's own measured inlier distance -- the same number and the same sensor as lidar_front_wall_inlier_distance_m, deliberately tighter than glass_line_inlier_dist (0.05), which is loose because a pane's support returns span a wide incidence range where range error grows."

# ============================================================
# mission_translator -- llm/plan_translate.translate()
# ============================================================
# Everything translate() is allowed to inject into a mission the LLM did not
# author. The model emits INTENT only (schemas/intent_v1.json): no speed, no
# timeout, no turn magnitude, no ids. Each key below is one of the four
# permitted provenance sources -- see plan_translate.py's "INTENT v1 ->
# mission v3.0" header for the rule, and llm/README.md for the D1-D4 record.
#
# TranslatorConfig duplicates these defaults so the module stays importable
# without an ament index; test_intent_translate.py asserts the two agree, so
# changing a value here without changing it there fails the suite.
mission_translator_speed_straight:
  # 0.5 since 2026-10-13 (was 0.4): every move defaults to 0.5 m/s.
  default: 0.5
  # real: the run-up speed of missions/wall_turn.json, run on hardware 2026-09-14
  description: "Speed [m/s] for a straight intent phase. Not an independent guess: it is the speed missions/wall_turn.json runs its 2 m straight run-up at."
mission_translator_speed_turn:
  default: 0.5
  # real: the turn speed of missions/wall_turn.json, run on hardware 2026-09-14
  description: "Speed [m/s] for a turn intent phase. The speed missions/wall_turn.json turns at, which is deliberately higher than the straight run-up."
mission_translator_speed_go_to:
  # 0.5 since 2026-10-13 (was 0.4): every move defaults to 0.5 m/s.
  default: 0.5
  # the speed of missions/go_to_person.json / go_to_chair.json (rig-verified, not floor-run)
  description: "go_to_object.speed [m/s] for a go_to intent phase: the approach speed missions/go_to_person.json and go_to_chair.json use. FLOOR VALUE 0.4, and it must not go lower: 0.4 m/s is the operating floor, the minimum commanded forward speed while the car moves (below it the car is not operated; zero is used only to stop). Under max_forward_speed_mps (0.5), so the approach itself is never clamped."
mission_translator_go_to_acquire_timeout_sec:
  default: 5.0
  description: "go_to_object.acquire_timeout_sec [s] for a go_to intent phase: how long the handler looks for a confirmed track of the class before the move fails target_not_found. Same value as missions/go_to_person.json."
mission_translator_go_to_lost_grace_sec:
  default: 1.5
  description: "go_to_object.lost_grace_sec [s] for a go_to intent phase: how long a lost target is driven toward its last point at reduced speed before the move fails target_lost. Same value as missions/go_to_person.json."
mission_translator_turn_magnitude_deg:
  default: 90.0
  description: "Magnitude [deg] of every turn the translator emits, written into BOTH drive.turn_mag_deg and stop_condition.value from one variable. The behaviour tree honours any value -- condition_eval's orientation_delta ends the move on abs(turn_accum_deg) >= abs(value), nothing clamps it to 90 -- so this is a real choice. It stays 90 because 90 is the only magnitude the stack has been run at, and the MPC side of a larger turn is unverified."
mission_translator_nominal_yaw_rate:
  default: 0.22
  # real, measured: mission_reports/wall_turn_20260914T160547.json
  description: "Assumed yaw rate [rad/s] used ONLY to size a turn's timeout. Never commands anything, so a wrong value makes the timeout loose or tight and cannot steer the car. MEASURED, not synthetic: the 2026-09-14 hardware run of missions/wall_turn.json turned 1.6091 rad in 7.3747 s = 0.2182 rad/s at drive.speed 0.5. The first draft of this key said 0.6, which is 2.8x too fast and sized a 90 deg turn's timeout at 13 s against an observed 7.4 s turn."
mission_translator_open_guard_max_distance:
  default: 10.0
  # SYNTHETIC -- retune on hardware
  description: "Assumed worst-case travel [m] for the guards that have no bounded distance (wall, front_object), used to size their timeout. Without it an open guard that never fires produces a move that never ends -- which is exactly what the generated missions before this work did, since they carried no timeout at all. SYNTHETIC."
mission_translator_timeout_factor:
  default: 3.0
  # SYNTHETIC -- retune on hardware
  description: "Multiplier on the expected duration in timeout_sec = clamp(ceil(expected_s * factor + floor), 1, 300). 3x leaves room for a slow start and a guard that fires late without letting a stuck move run for minutes. SYNTHETIC."
mission_translator_timeout_floor:
  default: 5.0
  # SYNTHETIC -- retune on hardware
  description: "Constant [s] added in the timeout formula, so a very short move still gets time to start moving at all. SYNTHETIC."
mission_translator_mission_id_prefix:
  default: "llm"
  description: "Prefix of the generated mission_id, which is f'{prefix}_{sha1(canonical_json(intent))[:12]}'. Deterministic on purpose: the same intent yields the same id, so golden tests are stable and a re-issued command is recognisable as the same mission. Never a timestamp."
mission_translator_post_turn_uses_straight:
  default: true
  description: "Decision D1. true: a straight phase after a turn is emitted as drive.mode 'straight', which is what plan_translate has always done and what missions/wall_turn_then_straight.json exercises. false restores the old workaround (re-emit it as a wall_turn carrying the previous turn's sign and zero magnitude) for the case where a straight move after a turn turns out not to hold its heading on hardware. NOT YET CONFIRMED ON HARDWARE -- wall_turn_then_straight.json has not been run."

# ============================================================
# go_to_enabled -- llm/llm_planner_node.py (planner_path v2)
# ============================================================
# The single switch between the planner with and without go_to. true: the
# prompt teaches go_to (prompts/planner_system_prompt.v2.it.txt) and a go_to
# phase becomes a go_to_object move. false: the planner behaves as before
# go_to_object existed -- the prompt without go_to
# (prompts/planner_system_prompt.v2.no_go_to.it.txt), the translator's
# UnsupportedIntentModeError refusal and the RICHIESTA NON SUPPORTATA banner.
# Read once at node start: restart llm_planner_node after flipping it. A ROS
# parameter of the same name overrides it for one run.
go_to_enabled:
  default: true
  description: "llm_planner_node (planner_path v2): true lets the LLM plan go_to phases, translated to go_to_object moves; false restores the refusal and banner of the planner without go_to. Read at node start."

# --- per-cycle wall fusion (wall_fusion.py, lidar_front_wall_node) -----------
# Step 3 of the wall pipeline: the LiDAR line fits and the stereo column
# profile (/perception/stereo_columns) are cross-checked column by column and
# emitted as stateless observations on /perception/wall_observations. The
# tracker consumes only those. Nothing here remembers anything.
front_clearance_scene_mask_cloud_stride:
  default: 4
  description: "Publish every Nth WALL point on /perception/wall_points. The cloud is for inspection, recording and the stereo-only line fits, NOT for any column decision (those are made on the full-resolution /perception/stereo_columns profile), so decimating it costs nothing real. The full set is ~50k points a frame, about 3 MB/s at 5 Hz straight into every recording."
front_clearance_scene_mask_column_percentile:
  default: 20.0
  description: "Which percentile of a column's WALL depths becomes that column's distance. A LiDAR beam reports its FIRST return, so the honest stereo counterpart is the NEAR end of the column, not its middle: in a column with a near wall low down and a far wall above it the median reports a surface that is not there. A percentile rather than the minimum keeps one bad pixel from deciding the column."
front_clearance_scene_mask_column_min_px:
  default: 5
  description: "Fewest WALL pixels in a column for it to have a stereo distance at all; below this the column reports NaN ('nothing to say'), which is a third state and never a distance."
front_clearance_scene_mask_column_row_stride:
  default: 1
  description: "Keep every Nth WALL pixel before summarising the per-column stereo profile. The per-column percentile is the single most expensive stage of the scene-mask tick -- 8.5 ms of 21.8 on an idle Orin, 5.8 ms of which is ONE sort over every WALL pixel (tools/mask_stage_profile.py) -- and that sort is linear in the pixel count. With a median 135 WALL pixels per non-empty column against min_px 5, a stride of 2 halves the stage and still leaves 67 per column (p05 20). 1, the default, keeps today's behaviour exactly: the saving is real but it changes a PUBLISHED profile, so it is opt-in until a run has been compared with it on."
lidar_front_wall_stereo_profile_max_age_s:
  default: 0.6
  description: "How old [s] a /perception/stereo_columns profile may be and still be used, on the CAMERA IMAGE stamp the message carries, not its arrival. Replaces the 0.15 s hard pairing gate (lidar_front_wall_stereo_columns_max_age_s, removed): that edge passed only 44 of 238 live cycles on corridor10m_20261015T171753, so 81 % of the run's observations were LiDAR-only not because the camera had nothing to say but because it had said it slightly too early -- and it trusted a 0.14 s profile and a 0.01 s one identically. The geometry is now carried to the cycle's own moment on /odometry/filtered (lidar_front_wall_node._compensate, applied to the scan AND to the fitted lines) and the remaining error is paid for with a weight (lidar_front_wall_stereo_profile_min_weight). 0.6 s is what the compensation can still carry: at this car's 0.6 m minimum radius it is 28 deg of yaw, a 128-column shift at fx 262 px, which is compensated, and the residual is the scene moving plus the odometry's own error over the interval."
lidar_front_wall_stereo_profile_min_weight:
  default: 0.3
  description: "What a profile at stereo_profile_max_age_s is still worth, on a scale where a zero-age profile is 1 (wall_fusion.age_weight; linear between, 0 past the limit). It scales three things consistently, all in the direction 'less trusted': the stereo sigma of the fused observation is DIVIDED by it (so at 0.3 the stereo sigma is 3.3x its fresh value and the inverse-variance combination leans on the LiDAR), the corroboration term of the confidence is pulled toward the neutral 0.5, and -- the one that matters most -- the veto needs proportionally more disagreement, because rejecting a wall the LiDAR fitted removes the evidence entirely rather than adjusting it. 0.3 rather than 0 so an old profile can still corroborate; UNTUNED against a ground-truth wall list."
lidar_front_wall_wall_obs_tol_base_m:
  default: 0.05
  description: "Constant part of the LiDAR/stereo agreement tolerance [m]: the part that does not come from stereo range noise (extrinsic error, the scan plane vs the column, timing). UNTUNED against a bag with depth."
lidar_front_wall_wall_obs_tol_quad_per_m2:
  default: 0.012
  description: "Range-squared part of the agreement tolerance [m/m^2]: tol = base + this * range^2, because stereo depth error IS quadratic (sigma_Z = Z^2 sigma_d / (fx b); on this rig, ZED 2i with a 0.12 m baseline and fx 262.4 at 640x360, half a pixel of disparity error is 1.6 cm at 1 m and 57 cm at 6 m). A FIXED tolerance would call every far column DISAGREE and every near one AGREE, which says more about the tolerance than about the sensors. 0.012 is ~0.4 px of disparity error."
lidar_front_wall_wall_obs_disagree_reject_frac:
  default: 0.5
  description: "Fraction of a wall's OPINIONATED columns (AGREE + DISAGREE) that must disagree before the whole observation is rejected and counted. Rejection is deliberate: when both sensors report a surface and they are too far apart to be the same one, the honest answer is that this cycle does not know, not that one of them wins. A run of rejections means the extrinsic or the depth is wrong, not that the wall moved, which is why it is published (WallObservationArray.n_rejected) and logged."
lidar_front_wall_wall_obs_stereo_min_rho_m:
  default: 0.4
  description: "A STEREO-only wall observation whose line passes nearer base_link than this [m] is the car's own chassis and is dropped before the tracker (counted as stereo_near_rejected on /perception/virtual_wall/debug, WARN throttled). corridor10m_20261016T144537 made 23 throwaway stereo 'right' tracks at rho 0.20 m from the chassis in the lower right of the image. 0.4 is just inside the front bumper (base_front_x 0.405 from base_link): a vertical line that close to base_link runs through or touches the car, and LiDAR-backed lines are never filtered (a real surface touching the car must stay). The primary guard; the self polygons (front_clearance_scene_mask_self_polygons) are the second."
lidar_front_wall_wall_obs_stereo_min_columns:
  default: 8
  description: "Fewest CONTIGUOUS stereo-only columns that may become a stereo-sourced wall (glass, or a surface too dark for the LiDAR). One such column is noise: a stray pixel, a reflection edge. This is the one path where nothing cross-checks the result, so the bar is a shape the LiDAR could not plausibly have missed by accident."
lidar_front_wall_wall_default_height_m:
  default: 2.5
  description: "Height [m] above the floor a wall observation is assumed to have when the stereo measured no height for it (a wall outside the camera's view, or one the stereo never confirmed). Heights are only ever taken from the columns the stereo AGREED on; borrowing them for a wall it never saw would invent a measurement. 2.5 m is an indoor corridor wall, and the field is flagged (height_measured false) so a consumer can tell."

# --- the wall tracker's observation model and FRONT rule (step 4) ------------
# The tracker consumes ONLY /perception/wall_observations. An observation
# carries no covariance of its own, so the tracker synthesises one from the
# two things that determine the error: which sensor saw the wall and how far
# away it was (multi_wall_tracker.observation_covariance).
lidar_front_wall_lidar_sigma_base_m:
  default: 0.02
  description: "Constant part of a LIDAR observation's distance sigma [m]. The Hokuyo's own range error is millimetres; what this covers is the odometry the line is placed with and the extraction's own bias. Matches the existing meas_sigma_rho_min floor."
lidar_front_wall_lidar_sigma_per_m:
  default: 0.005
  description: "Range-proportional part of a LIDAR observation's sigma [m/m]: the beam footprint grows with range, so a far wall's line is placed slightly less well. LINEAR, not quadratic: unlike stereo, LiDAR range error does not blow up with distance, and at 6 m this is 5 cm against the stereo's 46 cm. That ratio is the honest difference between the sensors and is what makes a LiDAR wall win an argument."
lidar_front_wall_stereo_sigma_base_m:
  default: 0.03
  description: "Constant part of a STEREO observation's distance sigma [m]: the extrinsic and the column summary, before range noise."
lidar_front_wall_stereo_sigma_quad_per_m2:
  default: 0.012
  description: "Range-SQUARED part of a stereo observation's sigma [m/m^2], the same quadratic the cross-check tolerance uses and for the same reason (sigma_Z = Z^2 sigma_d / (fx b)). A wall both sensors agree on gets the inverse-variance combination of the two and is therefore TIGHTER than either alone, which is the whole point of having agreed."
lidar_front_wall_min_span_for_angle_m:
  default: 0.3
  description: "Shortest span [m] used when turning a distance sigma into an angle sigma (sigma_theta = sigma_rho / span). A 5 cm uncertainty on a 3 m wall pins the angle far better than the same 5 cm on a 40 cm stub, and a short segment's angle is exactly what must not be trusted. The floor stops a tiny segment producing an absurd angle sigma."
lidar_front_wall_stereo_confirm_hits:
  default: 5
  description: "Hits within lidar_front_wall_stereo_confirm_window that confirm a track the LiDAR has NEVER seen. Stricter than the ordinary 3-in-5 because stereo-only evidence is the weak kind: on this building's floor the stereo invents whole surfaces out of reflections, and a one-frame reflection must never leave a confirmed wall behind. A LiDAR or BOTH hit promotes the track to the ordinary rule immediately (it is no longer stereo-only); it does NOT confirm it on the spot, so one spurious line still cannot make a wall."
lidar_front_wall_stereo_confirm_window:
  default: 7
  description: "The window the stereo-only confirm rule counts over. Longer than the ordinary 5 so a wall must persist across more of the scene before anything acts on it."
lidar_front_wall_role_hysteresis_rad:
  default: 0.0873
  description: "How far past its 45 deg sector edge [rad, 5 deg] a wall keeps the role it already had. Without it a wall sitting on a boundary flips between front and left every scan as the car wobbles, and every consumer keyed on the role flips with it."
lidar_front_wall_stereo_front_max_normal_rad:
  default: 0.5236
  description: "A STEREO-ONLY wall may be the FRONT wall only when its normal is within this [rad, 30 deg] of the heading. Nothing cross-checks a stereo-only wall, so it may stop the car only when it is squarely across the path, never as a glancing surface. A wall the LiDAR has seen is not subject to this."
lidar_front_wall_front_strip_margin_m:
  default: 0.15
  description: "Margin [m] added to the car's body half-width (swept_clearance_body_half_width_m, 0.136) to give the TRAVEL STRIP, |y| <= 0.286 m ahead of the front bumper (vehicle_frames.base_front_x), that a track's MEASURED segment must meet to be the FRONT wall; the FRONT distance is where that strip meets the segment. Replaces lidar_front_wall_front_strip_half_width_m (0.186 = front_side_limit_m, body + front_beside_body_margin_m 0.05), block 3, 2026-10-16: 0.15 is the owner's travel margin (steering wobble, the yaw-scale error of the odometry), not the 5 cm mesh uncertainty. The same strip gives the front/back ROLES and the strip's own beam test (lidar_front_wall_front_contradict_margin_m). The camera scene-mask stats keep their 0.186 strip (front_clearance_scene_mask_strip_half_width_m): they are statistics, not the contract. This is the test that separates 'a wall is in the way' from 'a wall's normal points roughly forwards' (corridor_phantom, 2026-10-15)."
lidar_front_wall_front_min_confidence:
  default: 0.5
  description: "Lowest track confidence that may be FRONT. A track's confidence is the mean of its last 5 matched observations' wall_fusion.confidence, raised to the rectangle's support when the rectangle VERIFIED it. On that scale a LiDAR wall with a few dozen tight inliers is 0.6-0.9 and a stereo-only line is capped at 0.35 by design, so 0.5 means 'LiDAR quality, or the stereo verified over the whole wall rectangle'. Before block 3 the confidence was the last observation's and nothing read it."
lidar_front_wall_front_lidar_recent_cycles:
  default: 3
  description: "A FRONT track must have been associated with a LiDAR-backed (LIDAR or BOTH) observation within this many tracker cycles (one per lidar_front_wall_wall_tracker_scan_decimation scans, ~0.3 s at 4), or be rect VERIFIED. A track that is only coasting, or only fed by unverified stereo, has nothing measuring it and cannot hold FRONT: corridor10m_20261016T144537 held one for 5 s with no LiDAR fit and stopped ~5 m early."
lidar_front_wall_front_contradict_margin_m:
  default: 0.5
  description: "The travel strip's nearest LiDAR return, from the bumper, more than this [m] BEYOND where the strip meets a track CONTRADICTS the track: every in-strip beam went through where the wall should be. Within it the strip SUPPORTS the track; nearer is BLOCKED (a nearer surface, no evidence); no return at all (glass, range, beams cut for an object) is NO_RETURNS, never free space. 0.5 m is front_phantom_replay's PHANTOM_MARGIN_M. Applies to every confirmed track that meets the strip, LiDAR-fitted or not (a fit across an opening is what the extraction's 1.5 m collinear merge can build in one scan), and to GLASS too."
lidar_front_wall_front_contradict_cycles:
  default: 2
  description: "Consecutive CONTRADICTED tracker cycles that mark a track CONTRADICTED: it is no longer FRONT, its role becomes 'unknown', it stops occluding the wall the beams actually reach, and only a cycle whose strip SUPPORTS it again clears the mark. It is not deleted (deleting a FRONT used to latch NO_DATA). A coasting FRONT is dropped on the FIRST contradicting scan (lidar_front_wall_wall_tracker_front_max_coast_sec)."
lidar_front_wall_front_clear_range_m:
  default: 2.0
  description: "r_clear [m, from the bumper]. With no FRONT track the virtual wall is CLEAR. If the travel strip still holds a LiDAR return nearer than this, /perception/virtual_wall/debug says front_reason 'unexplained_returns' -- an object, a contradicted or still-tentative wall -- but the contract stays CLEAR: objects are front_clearance's and IsProximityTooClose's business, a wall invented from raw returns is the phantom path all over again, and NO_DATA (-1) would hold the car on data that is not missing. Diagnostic only; 2.0 m is about 4 s at the mission speed."

# --- the front wall output contract (step 5) ---------------------------------
wall_clear_distance_m:
  default: 50.0
  description: "The value the front wall topics carry when the sensors are working and there is NO wall in the way (wall_fusion.STATE_CLEAR). A large FINITE number, and it is not a wall at 50 m: it means 'nothing ahead'. SHARED -- every producer and consumer of a wall distance reads this one key, so 'clear' is the same number everywhere. It must stay far above any mission's stop threshold and any MPC trigger distance, and consumers must CAP or SKIP it rather than feed it into geometry (MPC_corr treats it as unknown). The state this expresses is what the old pipeline could not: with nothing in the strip the LiDAR reported too_few_returns and the stereo plane -- the SIDE wall -- became the front wall at 1.1 m (corridor_phantom, 2026-10-15)."

# --- wall visualisation and the semantic wall layer (step 7) -----------------
# Consumed by: f1tenth_costmap/semantic_layer_node.py (its tf_static_only
# parameter, default single-sourced from here). cpu-cleanup 2026-10-16.
# MUST BE false IF THE CAMERA PAN JOINT IS EVER ENABLED (camera_pan_enabled on
# the branches that have it): the camera -> base_link chain then runs through
# a moving joint published on /tf, not /tf_static, every detections lookup
# fails (throttled WARN, batch skipped) and /costmap/semantic_tracks goes empty.
semantic_layer_tf_static_only:
  default: true
  description: "semantic_layer_node reads TF from the latched /tf_static only (no TransformListener, which deserialises every /tf message). Correct while every joint between the camera and base_link is fixed (sensors.xacro). Set false whenever the camera pan joint is enabled."
lidar_front_wall_wall_marker_thickness_m:
  default: 0.02
  description: "Thickness [m] of the vertical slab each confirmed wall is drawn as on /perception/walls/markers. A wall is a vertical PLANE, so it is drawn as one rather than as a line on the floor: the slab runs the wall's observed length and stands from the floor to lidar_front_wall_wall_viz_height_m, whatever height was measured. A wall whose height was only assumed (height_measured false) is drawn fainter."
lidar_front_wall_wall_viz_height_m:
  default: 2.5
  description: "Height [m] every wall marker is DRAWN at, standing on the floor: the slabs on /perception/walls/markers and the prisms on /viz/walls, and the door jambs on /viz/doors. Visualisation only -- MultiWallTrack.z_min / z_max and every estimated wall quantity are unchanged. Drawing the measured span made one corridor's walls a row of different heights in Foxglove (2.0 m when assumed, whatever the stereo reported when measured). Whether a height was measured still shows on /perception/walls/markers as the slab's alpha."

# --- door detection (f1tenth_perception/door_detection.py) --------------------
# PERCEPTION ONLY: /perception/doors (f1tenth_messages/DoorArray) and /viz/doors.
# Nothing consumes either -- not the MPC, the costmap boundaries, the BT or the
# missions -- and THE OVERLAY RULE holds: doors never modify, split or remove a
# wall or any LiDAR data, and nothing may treat a doorway as free space because
# a door is published there. Needs the wall tracker (use_wall_tracker).
# door_detection.py's module docstring has the full rule, in brief: only HOSTS
# (CONFIRMED wall tracks with role front, left or right) carry doors; EVERY gap
# between collinear hosts is judged, every depth PERPENDICULAR to the host line,
# and gets a code -- '' a door, STRONG evidence against one, WEAK undecidable,
# GEOMETRY not a candidate; an open leaf hung on a jamb is allowed; the stereo is
# optional; a door is a CANDIDATE until seen from two viewpoints with a steady
# width (CONFIRMED), and only a STRONG record on a visible gap strikes it.
# Per-cycle diagnostics are on /perception/virtual_wall/debug: door_candidates
# (every gap with its code), door_manhattan, door_n_strikes,
# door_n_deleted_by_strikes, door_n_confirmed, door_ms, door_errors,
# door_mask_age_s. Every default below is also the node's fallback, and
# DoorParams' default where it has the field (test_lidar_front_wall_node.py,
# TestDoorParamsCoupling).
lidar_front_wall_door_detection_enabled:
  default: true
  description: "Run door detection on every wall tracker cycle, after the walls are published, and publish /perception/doors and /viz/doors. Off: neither topic exists and nothing is computed. Needs use_wall_tracker (the doors are found in the tracker's walls). A door cycle that raises is logged (throttled) and counted (door_errors on /perception/virtual_wall/debug) and never stops the walls; after 50 consecutive failures the node turns door detection off for its life."
lidar_front_wall_door_publish_candidates:
  default: false
  description: "Also publish CANDIDATE doors on /perception/doors (Door.state says which). Off: /perception/doors carries CONFIRMED doors only, so a reader of the topic never sees a door the lifecycle has not confirmed -- one seen from a single place, or whose width is not yet steady. /viz/doors always draws both (confirmed solid, candidate faded), and the debug topic lists every gap with its code, whatever this says."
lidar_front_wall_door_collinear_angle_deg:
  default: 5.0
  description: "Two HOST wall tracks either side of a doorway must be the same line within this angle [deg]; a door-wide gap between two that are not is 'not_collinear' (GEOMETRY: not a candidate, no effect on any door). Within a single track (the in-track fallback, for a borderline gap the tracker still joined into one) it holds by construction. A corner fails it: a corner is not a doorway."
lidar_front_wall_door_collinear_offset_m:
  default: 0.10
  description: "...and within this perpendicular offset [m], measured where it matters: each wall's FACING end against the other wall's line."
lidar_front_wall_door_width_min_m:
  default: 0.70
  description: "Narrowest doorway [m], jamb to jamb -- AND THE COLLINEAR GAP RULE for every LiDAR wall (multi_wall_tracker): two collinear wall pieces are ONE wall only across a gap SHORTER than this, in the extraction's collinear merge, the association of an observation to a track, the merge of two tracks and the rebuild of a track's extent; at or above it they stay two walls, so a doorway lies BETWEEN two tracks. Single source: it replaced lidar_front_wall_wall_merge_max_gap_m (1.5, the extraction) and lidar_front_wall_wall_assoc_max_gap_m (0.5, the tracker), and it applies whether or not door detection is enabled. THE PRICE, accepted: the tracker now bridges open gaps up to 0.70 m, wider than the 0.572 m travel strip, so a gap of 0.572-0.70 m between two collinear faces can be read as wall (a FRONT across an opening the car's strip would fit through); and the extraction no longer bridges a person-shaped hole wider than 0.70 m (the tracker still does: it counts only the OPEN part of a gap, never cut beams, both to keep a track whole and for the span a new track is born on, so a narrow wall first seen behind a detected person is still born); the same open-part counting means two short collinear walls whose gap is mostly hidden (a person standing in a 1.0 m mouth) are born as one wall, as long walls already were. The jambs are the last LiDAR returns ON the wall either side of the gap, so the measured width is the true one plus up to a beam spacing at each side (1.3 cm at 3 m)."
lidar_front_wall_door_width_max_m:
  default: 1.00
  description: "Widest doorway [m]; a gap outside lidar_front_wall_door_width_min_m .. this is 'width' (GEOMETRY), as are two collinear hosts too far apart to hold one doorway. Double doors and corridor mouths are wider and are out of scope."
# Hosts: only CONFIRMED wall tracks with role front, left or right carry a door.
lidar_front_wall_door_manhattan_prior:
  default: true
  description: "THE MANHATTAN PRIOR: rooms are rectangular. The node keeps the room's dominant wall direction (normal angle mod 90 deg) from the CONFIRMED walls at least lidar_front_wall_door_manhattan_min_wall_len_m long: a length-weighted 2 deg histogram, its peak refined by the weighted circular mean of the walls within lidar_front_wall_door_manhattan_tol_deg of it, smoothed over lidar_front_wall_door_manhattan_tau_sec. A host further than lidar_front_wall_door_manhattan_tol_deg from it is 'off_manhattan' (STRONG: the wall stays a wall, it just hosts no door); every other host is SNAPPED onto the dominant axis about its own midpoint for the gap tests, so a wall the tracker fitted a few degrees off is judged on the room's line (copies only: the tracks are never touched). The prior is on /perception/virtual_wall/debug (door_manhattan). Until the first eligible wall, or off: no check, no snap."
lidar_front_wall_door_manhattan_tol_deg:
  default: 10.0
  description: "How far [deg] a host's normal may lie from the nearest dominant axis and still carry a door (and be snapped onto that axis); also the window around the histogram's peak whose walls refine the dominant direction. A few degrees of fitting error on a confirmed wall is snapped away; a wall really set at another angle is not one of the room's walls."
lidar_front_wall_door_manhattan_min_wall_len_m:
  default: 1.5
  description: "Only CONFIRMED wall tracks at least this long [m] (their measured extent) vote for the dominant direction, weighted by length: a short face's angle is poorly known, and a short face is as likely furniture as a room wall."
lidar_front_wall_door_manhattan_tau_sec:
  default: 2.0
  description: "Time constant [s] of the dominant direction's smoothing (an EMA on the 4-fold circle, alpha = 1 - exp(-dt / tau); the first update takes the cycle's direction outright). Rides out a cycle whose walls disagree without lagging a turn into a new room by more than a couple of seconds. A cycle with no eligible wall leaves it unchanged."
lidar_front_wall_door_min_line_extent_m:
  default: 2.0
  description: "'short_line' (STRONG): the union of the host tracks along the door's line, less the gap itself when it lies inside one track, must be at least this long [m]. A doorway sits in a wall; two short collinear faces a door-width apart (a pillar and a cabinet) are not one."
lidar_front_wall_door_min_side_len_m:
  default: 0.5
  description: "'short_side' (STRONG): each jamb's host track must run at least this far [m] from the jamb to its far end. A stub of wall beside a gap is as likely the side of a cabinet as a door frame."
lidar_front_wall_door_host_front_facing:
  default: false
  description: "FRONT-FACING HOSTS (door_detection, HOST). Off (the addendum as written): only CONFIRMED walls with role front, left or right host a door. The tracker's 'front' is the wall crossing the car's 0.57 m travel strip, so the two pieces either side of a doorway STRAIGHT AHEAD are role unknown and such a doorway is found only once it is beside the car (left/right hosts) or inside one track. On: a CONFIRMED track that is role unknown for its geometry alone (not REJECTED by the rectangle, not occluded, not contradicted), lying entirely ahead of the car within 1.5 m either side of its centreline and facing it (normal within 30 deg of the heading), hosts too. Every other test applies unchanged."
# The beams across the gap and what can be decided from them.
lidar_front_wall_door_min_beams:
  default: 8
  description: "Floor on the DECIDED beams across the gap (through, shallow, leaf and reveal returns): fewer than max(this, ceil(lidar_front_wall_door_min_beam_fraction x the beams the gap's angular width promises at its range)) is 'few_beams' (WEAK: undecidable this cycle, no effect on any door). At the Hokuyo's 0.25 deg a 0.85 m gap square-on has 8 beams at 24 m, at 60 deg incidence at 12 m: the floor is what makes a far or grazing gap undecidable, and 8 beams is a width known to about +-1 beam spacing."
lidar_front_wall_door_min_beam_fraction:
  default: 0.8
  description: "The range scaling of lidar_front_wall_door_min_beams: of the beams the gap's angular width promises at its range and incidence, this share must actually cross it as decided beams. Near a door that is most of a hundred beams, so a handful that happened to pass cannot stand in for a gap the scan did not really look through."
lidar_front_wall_door_max_view_angle_deg:
  default: 45.0
  description: "'oblique_view' (WEAK: undecidable this cycle, no effect on any door): the ray from the laser to the gap's centre is more than this [deg] off the host line's normal. That obliquely the jambs shadow the gap, the beams through it are few and grazing, and glass passes them like an opening; the car will see it squarer from elsewhere."
# The gap tests: every depth PERPENDICULAR to the (snapped) host line, never
# along the ray.
lidar_front_wall_door_behind_margin_m:
  default: 1.0
  description: "Perpendicular depth [m] behind the host line from which a return counts as THROUGH the gap (no return at all is through too). A return between 5 cm and this behind the line is SHALLOW: an open leaf, a reveal, or something standing in the doorway ('not_a_leaf' at the jambs, 'behind' in the core); within lidar_front_wall_wall_negative_tol_m in front of the line to 5 cm behind it, ON the line. 1.0 (was 0.30): an open leaf is at most lidar_front_wall_door_leaf_max_len_m (1.0 m) long, so every leaf return is SHALLOW and judged as THE LEAF rather than counted as through, and a gap with furniture or a recess less than 1 m behind it is not an opening into a room."
lidar_front_wall_door_core_fraction:
  default: 0.6
  description: "The central share of a gap the 'behind' test reads (lidar_front_wall_door_behind_frac). The two outer parts ((1 - this) / 2 each, 0.17 m of a 0.85 m door) are where THE LEAF and THE REVEAL hang: shallow returns there must be an open leaf hinged at that side's jamb (one straight segment, rms <= 3 cm, starting at the jamb, at most lidar_front_wall_door_leaf_max_len_m long; followed on into the core and left out of the core's count) or the jamb's own side face; anything else shallow there is 'not_a_leaf' (STRONG)."
lidar_front_wall_door_behind_frac:
  default: 0.7
  description: "'behind' (STRONG): among the core's beams not on the leaf, fewer than this share THROUGH (lidar_front_wall_door_behind_margin_m behind the line, or no return): what lies behind the gap is too near to be a room (a cabinet in a recess, a closed leaf set back in a deep frame). A share rather than every beam, as until 2026-10-20: one stray return in the room beyond (a chair leg, a bin) no longer rejects a real doorway, while a surface across the gap still fails it by far. A leaf covering the whole core leaves nothing to read: 'few_beams' (WEAK)."
lidar_front_wall_door_on_line_min_beams:
  default: 2
  description: "'on_line' (STRONG): at least this many ON-band returns in a gap that lies INSIDE one host track's extent -- the tracker holds wall across that stretch, so the returns are the host wall and the gap is a dropout, not a doorway. Fewer are just not counted as through. ON returns in a gap BETWEEN two tracks are 'unknown_in_gap' instead (WEAK, detail unknown_on_line): an unknown segment (a closed leaf, a pane seen square-on, a panel) is never evidence for or against a door."
lidar_front_wall_door_boundary_behind_min_m:
  default: 0.30
  description: "'not_boundary' (STRONG) counts the finite returns more than this [m] behind the host line along both host segments, from each jamb to its track's far end: a wall the LiDAR sees through elsewhere (a glass partition's panes between its frames) is no boundary, and a gap in it is no doorway. Returns on another CONFIRMED wall perpendicular to the host (within 20 deg) do not count (a corner's other wall); nor do cut beams or no-returns."
lidar_front_wall_door_boundary_max_hits:
  default: 2
  description: "More than this many lidar_front_wall_door_boundary_behind_min_m returns over both host segments is 'not_boundary'. A couple are tolerated: a beam slipping past a mullion's edge or a crack says little about the wall."
lidar_front_wall_door_boundary_end_margin_m:
  default: 0.10
  description: "The not_boundary count keeps this far [m] from both ends of each host segment: the doorway's own edge and the segment's far corner put returns behind the line that say nothing about the wall between them."
# THE LEAF and THE REVEAL.
lidar_front_wall_door_leaf_max_len_m:
  default: 1.0
  description: "Longest open door leaf [m], measured from its jamb along the leaf's own line: longer than a door is wide is a wall or furniture, not a leaf."
lidar_front_wall_door_leaf_hinge_tol_m:
  default: 0.10
  description: "An open leaf's line must pass within this distance [m] of the jamb it hangs on, and must START there rather than run through it. A box face behind the wall line misses its jamb by its own depth and is not a leaf."
lidar_front_wall_door_reveal_max_depth_m:
  default: 0.20
  description: "THE REVEAL: shallow returns within 5 cm of a jamb along the line and at most this deep [m] are the jamb's own side face -- the wall's thickness at a door frame -- allowed at both jambs and left out of the core's count. Two perpendicular faces deeper than this at both jambs are a thick wall's two reveals: a door with no leaf."
# The stereo (the class mask + depth pair of the rectangle verification), only
# when a gap passed every LiDAR test; fetched at most once a cycle and carried
# from the mask stamp to the scan stamp on the odometry. Never required.
lidar_front_wall_door_stereo_glass_veto:
  default: false
  description: "OFF by default. When on and the stereo class mask + depth cover a door gap: if WALL pixels whose valid depth lies within lidar_front_wall_door_stereo_plane_tol_m of the wall line make up at least lidar_front_wall_door_stereo_wall_veto_frac of the gap's valid samples, the gap is a pane the LiDAR saw through: 'stereo_wall' (STRONG). WALL pixels farther than that (the room behind an open door) never count. When less than half the gap's samples carry valid depth the stereo cannot say: no veto, and the door is flagged glass_suspect."
lidar_front_wall_door_stereo_plane_tol_m:
  default: 0.30
  description: "How close [m] to the wall line's own depth (optical z, the ZED's depth convention) a WALL pixel's depth must be to count as a surface ON the line: for the glass veto and for the jamb height check's wall samples."
lidar_front_wall_door_stereo_wall_veto_frac:
  default: 0.5
  description: "Share of the gap's valid-depth samples that must be WALL ON the line for the glass veto to reject the gap."
lidar_front_wall_door_jamb_height_check:
  default: true
  description: "THE JAMB HEIGHT (stereo, only with a stereo frame): beside each jamb, samples on the wall plane 0.05-0.30 m outward and 0.1-2.4 m up are projected into the class mask; a WALL pixel at the plane's depth is wall there. Both sides' wall reaching lidar_front_wall_door_jamb_min_height_m: a real wall, the door's jamb height is known. A side whose wall ends below lidar_front_wall_door_furniture_max_height_m while the camera sees at least 0.3 m above it (and no wall there) is 'furniture' (STRONG): a gap between desks or cabinets, which a planar LiDAR, seeing one height only, cannot tell from a doorway. No valid depth, no wall pixels or a view clipped below the minimum: no decision, and the door is flagged jamb_height_unknown (Door.jamb_height_unknown, ' jamb?' on /viz/doors)."
lidar_front_wall_door_jamb_min_height_m:
  default: 1.8
  description: "The wall beside both jambs must reach this high [m] for the jamb height to be known: a door frame stands in a wall at least door height."
lidar_front_wall_door_furniture_max_height_m:
  default: 1.3
  description: "A jamb's wall surface ending below this [m], with the room seen above it, is furniture (desks are ~0.75 m). Between this and lidar_front_wall_door_jamb_min_height_m (a tall cabinet, a half-height partition) there is no decision."
# The lifecycle (DoorTracker): candidate -> confirmed from two viewpoints with
# a steady width; a STRONG record on a VISIBLE gap strikes a door (back to
# candidate; a second strike deletes it); WEAK and GEOMETRY records change
# nothing. Doors no longer coast.
lidar_front_wall_door_min_viewpoints:
  default: 2
  description: "A CANDIDATE door is CONFIRMED once its evidence (its last lidar_front_wall_door_confirm_window positive sightings) holds at least this many separate car positions (lidar_front_wall_door_viewpoint_sep_m apart) and a steady width (lidar_front_wall_door_width_std_max_m). A car standing still never confirms a door: from one place a gap that only looks open from there (glass seen obliquely, a shadow edge) cannot be told from a doorway."
lidar_front_wall_door_viewpoint_sep_m:
  default: 0.3
  description: "Car positions at least this far apart [m] are separate viewpoints (greedy: a position this far from every earlier representative starts a new one)."
lidar_front_wall_door_width_std_max_m:
  default: 0.05
  description: "The population std [m] of the evidence widths must be below this to confirm: a doorway's width does not change with the viewpoint; a gap whose ends are shadow edges or furniture does."
lidar_front_wall_door_confirm_window:
  default: 20
  description: "The evidence window: a door keeps its last this many positive sightings (car position, observed width) for the confirmation; a strike clears it. Until 2026-10-20 this name was the 3-of-5 hit window (default 5)."
lidar_front_wall_door_candidate_max_age_sec:
  default: 10.0
  description: "A CANDIDATE door with no positive sighting for this long [s] is dropped. WEAK and GEOMETRY records (an oblique view, too few beams, a person in the gap) neither refresh nor kill a door; only time does, or two strikes."
lidar_front_wall_door_confirmed_max_age_sec:
  default: 60.0
  description: "A CONFIRMED door with no positive sighting for this long [s] is dropped, unless a detected person inside it (occupied) holds it. Long on purpose: a confirmed door out of the car's view has not stopped being a door; STRONG evidence on a visible gap (two strikes) removes it sooner."
lidar_front_wall_door_square_looks:
  default: 0
  description: "SEEN SQUARE-ON, OPTIONAL: when > 0, a door also needs this many SQUARE LOOKS to be CONFIRMED -- cycles on which at least lidar_front_wall_door_square_min_beams of its core's beams within lidar_front_wall_door_square_incidence_deg of its normal went THROUGH and no beam of its core returned on its line. Why it exists: glass is invisible to the LiDAR obliquely and returns it only square-on (corridor10m_20261016T144537, a pane between two frames: ON on 100 / 94 / 51 / 19 / 0 % of its beams at 0-1 / 1-2 / 2-3 / 3-4 / 4-5 deg). 0 (default, was 1): off -- the two-viewpoint rule is the confirmation, and a square look required by default would leave every door the car only passes obliquely a candidate."
lidar_front_wall_door_square_incidence_deg:
  default: 3.0
  description: "How close to the door's normal [deg] a beam must run to count for a square look (only with lidar_front_wall_door_square_looks > 0). 3 (was 2): the whole band in which a pane still returns about half its beams or more (100 / 94 / 51 % at 0-1 / 1-2 / 2-3 deg)."
lidar_front_wall_door_square_min_beams:
  default: 8
  description: "Fewest square-on beams through a door's core for a square look. 6 deg of beams at 0.25 deg is 24, so the laser's foot on the door line must be well inside the core. A pane returns most of those beams: 8 of them all clear would be very unlikely if beams were independent (they are not quite, so read it as: never seen in the bag)."
lidar_front_wall_door_jamb_viz_diameter_m:
  default: 0.10
  description: "Diameter [m] of each jamb's vertical cylinder on /viz/doors. The cylinders are lidar_front_wall_wall_viz_height_m tall and stand on the floor. Visualisation only."

# --- minimum width for a LiDAR wall (multi_wall_tracker's span gate) ----------
# A wall is long; an object face, a chair leg, the end of a counter and a
# person's two legs are short, and the extraction reports geometry, not
# semantics. One threshold has to choose between two failures: high, and a wall
# seen edge-on or mostly occluded stops being tracked whenever it shortens;
# low, and every short face in the room starts a wall track -- which is how a
# 1.39 m "front" wall sat 2 m ahead of the car for 30 s of an EMPTY corridor
# (corridor10m_20261015T171753, track 8; the true nearest return in the strip
# never came inside 14.4 m). Birth and maintenance are different questions, so
# they get different thresholds. See multi_wall_tracker.py's own "WHY THE SPAN
# GATE IS HYSTERETIC".
lidar_front_wall_wall_min_span_birth_m:
  default: 1.0
  description: "Shortest observation [m] that may START a wall track. Measured on the WALL the observation is a piece of (multi_wall_tracker, THE WALL'S SPAN): its own extent, or for a LiDAR piece the extent of the LiDAR pieces of the same scan it is one wall with -- the same line by the tracker's chi2 gate and less than lidar_front_wall_door_width_min_m of OPEN gap between them. A stretch hidden behind a detected object's cut sector or a nearer return counts as wall; a stretch no beam looks at counts as open. So a person in front of a narrow wall does not stop it being born, and a doorway the beams see through still keeps the pieces either side of it apart. Starting a wall is a claim about the world, so it needs real extent. UNTUNED against a ground-truth wall list: chosen as the length below which this building's furniture lives, and verified only in that it does not cost the corridor run its real walls."
lidar_front_wall_wall_min_span_update_m:
  default: 0.5
  description: "Shortest observation [m] that may UPDATE an already CONFIRMED wall track. Anything shorter is not a wall at all and never reaches the tracker. A confirmed wall briefly seen short -- someone walks past it, the car turns and grazes it, half of it leaves the sector -- is still that wall, so maintenance is cheaper than birth. Matches corridor_perception's own ExtractionParams.min_length (0.50), the point below which a segment is already dropped as unsupported, so this is the gate's floor and not a second opinion about it. Measured on the same span as lidar_front_wall_wall_min_span_birth_m (the wall's)."
# ---- E3: what a ROLE is, and when a track stops being one ------------------
# A role used to be the BEARING of the wall as seen from the car, in 45 deg
# sectors. That makes the far end of a corridor "front" and the near stretch
# of the same wall "left" -- one surface with two roles depending on where the
# car happens to be along it -- and it is how a wall whose normal happened to
# point forwards became the FRONT wall at 1.1 m (corridor_phantom). A role is
# now GEOMETRY: in the car's strip, or beside the car with a lateral normal,
# or 'unknown'. 'unknown' is a first-class answer: tracked, drawn, a reference
# for nothing.
lidar_front_wall_wall_role_back_x_m:
  default: 0.0
  description: "Rear edge [m, base_link] of the car-width strip for the BACK role. The description has no measured rear bumper (only base_front, vehicle_frames.base_front_x), so base_link's own origin is the boundary and this is the parameter that says so. A segment inside the strip but between back_x and the bumper is BESIDE the car, not in its way, and gets neither front nor back."
lidar_front_wall_wall_role_side_x_min_m:
  default: -1.0
  description: "Nearest edge [m, base_link] of the x window a LEFT/RIGHT wall must reach into. A wall 20 m behind the car is still a wall and still tracked, but it is a reference for nothing: the window is the stretch the car is beside or about to be beside. -1.0 m is one car length behind base_link."
lidar_front_wall_wall_role_side_x_max_m:
  default: 3.0
  description: "Far edge [m, base_link] of that window. 3.0 m is about 6 s of travel at the mission speed: far enough that a side wall is named before the car is level with it, near enough that the far end of a corridor is not called a side wall."
lidar_front_wall_wall_role_side_max_normal_deg:
  default: 45.0
  description: "How far [deg] a side wall's normal may be from the LATERAL axis in base_link. Unlike the old sector test this is about the wall's own orientation, not its bearing, so the answer does not change as the car drives along the same wall."
lidar_front_wall_wall_role_hysteresis_m:
  default: 0.05
  description: "Length half of the role hysteresis [m]: a track keeps the role it has while the same geometric test still passes with every threshold relaxed by this much (and the normal sector by lidar_front_wall_role_hysteresis_rad). Without it a wall sitting on a threshold changes role every scan as the car wobbles, and so does every consumer keyed on it."
lidar_front_wall_wall_occlusion_margin_m:
  default: 0.1
  description: "How much nearer [m] a confirmed wall must be crossed by the ray LiDAR->point for that point to count as BEHIND it (first obstacle). Five points along each segment; 3 of 5 behind a confirmed wall makes the role 'unknown'. A LiDAR beam reports its FIRST return, so a line fitted behind a wall the same scan also saw is not a surface that scan observed -- it is the far side of the room through a gap, or a reflection. GLASS COUNTS AS A BLOCKER: a pane really does stop the LiDAR, which is why it has a track at all. The 5-and-3 shape is in the code (TrackerParams.occlusion_points/_min_blocked), not here: it is the rule, not a knob."
lidar_front_wall_wall_negative_tol_m:
  default: 0.15
  description: "How close [m] a beam's return must be to where it would meet a track's line to count as a HIT rather than a PASS (negative evidence). A beam more than this BEYOND the line went through where the wall should be; one SHORT of it is blocked by something nearer and says nothing about this wall. A no-return beam is a PASS: at these ranges a wall returns."
lidar_front_wall_wall_negative_min_beams:
  default: 5
  description: "Fewest opinionated beams (PASS + HIT) inside a track's own angular span -- shrunk 2 beams per side, because a grazing beam at the end of a span proves nothing -- before negative evidence may be counted at all."
lidar_front_wall_wall_negative_pass_frac:
  default: 0.7
  description: "Fraction of those beams that must PASS for the scan to CONTRADICT the track. Counted consecutively and reset by any scan that does not; lidar_front_wall_wall_negative_miss_to_kill of them in a row kills the track. This is the only mechanism that can remove a wall the observations have simply stopped mentioning: the lifecycle can only wait for a timeout, which a phantom survives for as long as the room keeps producing collinear triples near it."
lidar_front_wall_wall_negative_miss_to_kill:
  default: 5
  description: "Consecutive CONTRADICTED scans that kill a confirmed track. Never applied to a GLASS track: glass is the surface the beams are SUPPOSED to pass through, so this rule would kill every pane in the building."
lidar_front_wall_wall_tracker_delete_after_sec:
  default: 2.0
  description: "Longest [s] a track may go unassociated before it is deleted. 2.0, down from 3.0: a coasting wall's covariance grows and its line is only predicted, and three seconds of that at the mission speed is 1.5 m of travel on a wall nobody has seen. Read together with lidar_front_wall_wall_coast_max_odom_m -- time alone is the wrong unit while the car is standing still."
lidar_front_wall_wall_coast_max_odom_m:
  default: 1.0
  description: "Metres of ODOMETRY (path length, not displacement) a track may coast before it is deleted, whichever limit comes first. Standing still for two seconds costs a wall nothing and should not; driving a metre past a wall without one association means the wall is not where the track says it is."
lidar_front_wall_wall_extent_decay_sec:
  default: 1.0
  description: "A track's extent is the MEASURED one: the union of its associated observations from the last this-many seconds (the newest always kept), only across open gaps shorter than lidar_front_wall_door_width_min_m (THE COLLINEAR GAP RULE). An end no observation has reached for this long is dropped. It used to be the union of everything ever seen, so it only grew and FRONT could be a wall nobody had measured for seconds."
# ---- E2: the rectangle verification (wall_fusion.py, THE RECTANGLE) --------
# The column cross-check asks one question per BEARING, in the LiDAR's own
# plane. These ask the same question over the wall's whole RECTANGLE -- along
# it and up it -- which is what tells a wall from a chair standing in front of
# one, and a pane of glass from a phantom.
lidar_front_wall_wall_rect_verify:
  default: true
  description: "Verify every wall TRACK against the scene mask over its own rectangle (wall_fusion.verify_rectangles), not only per image column. Samples the track's segment every 5 cm and up it in 41 rows from the floor to 2 m, sorts each sample into at / beyond / against / uninformative from the class mask and the depth, and moves a sticky per-track state between UNVERIFIED, VERIFIED and REJECTED. FALSE leaves every track UNVERIFIED, which is exactly the pre-E2 behaviour: UNVERIFIED means lidar_only and is NOT a doubt about the wall. Subscribing is also what makes front_clearance_node publish /perception/scene_labels/classes and /depth_mm at all, so with this false the extra ~690 KB a tick is never produced."
lidar_front_wall_wall_rect_coverage_min:
  default: 0.25
  description: "Fewest INFORMATIVE samples, as a weighted fraction of the track's whole rectangle, before a rectangle verdict may move the track's state. support and beyond_share are fractions OF the informative samples, so with a handful of them they are noise. Below this the verdict changes nothing -- not the state, not the glass flag -- which is the common case for a wall outside the camera's ~100 deg and must leave it UNVERIFIED rather than REJECTED: 'the camera cannot see there' is not evidence against the LiDAR."
lidar_front_wall_wall_rect_support_verify:
  default: 0.5
  description: "Weighted fraction of the informative rectangle samples that must be AT or BEYOND the line for the track to become VERIFIED. A majority of what the stereo could speak about says the surface is there."
lidar_front_wall_wall_rect_support_reject:
  default: 0.2
  description: "Support at or below which the track becomes REJECTED -- four of five informative samples are an OBJECT, or a surface NEARER than the line. A REJECTED track is still tracked and still drawn; it is simply not a reference wall (its role becomes 'unknown'). Between this and the verify threshold NOTHING happens: the state is sticky and the dead band is the hysteresis, for the same reason the span gate and the role have one, and because the cost of the two mistakes is not symmetric."
lidar_front_wall_wall_rect_glass_beyond_share:
  default: 0.7
  description: "Fraction of a VERIFIED track's supporting samples that must be BEYOND the line for it to be called GLASS, whose distance then comes from the LiDAR alone. Glass is the one case where the stereo agrees a surface is there and reports it FURTHER than the LiDAR does: the pane is what the LiDAR ranged and the room behind it is what the stereo matched, so letting the stereo pull the fused distance would push the wall into the next room. The rule also requires 1 - beyond_share < 0.2 (hardly any sample AT the line), which makes the effective threshold 0.8; both halves are kept because the rule is that pair of statements, not one tuned number."
lidar_front_wall_wall_debug_tracks:
  default: false
  description: "Put every LIVE wall track on /perception/virtual_wall/debug's `tracks` list each scan -- role, state, rectangle verdict, glass, occlusion, miss count, endpoints -- together with the count of objects behind a confirmed wall. OFF by default because it is a base_link transform and two distance computations per live track per scan, and nothing in the control path reads it: the audit of 2026-10-15 measured the wall tracker at 155-178 ms a scan against a 25 ms scan period, so debug output has to be opt-in. corridor_wall_replay.py turns it on, which is where the per-track table comes from."
lidar_front_wall_wall_rect_max_range_m:
  default: 8.0
  description: "Furthest sample [m, optical Z] the rectangle verification treats as EVIDENCE. Past it a sample is not informative, whatever class it lands on, exactly like one that landed on the floor. On this rig the stereo does not measure past about 8 m: at the 15.5 m end wall of corridor10m_20261015T171753 it reports ~7 m, and the column cross-check already measures a DISAGREE rate of 1.00 with a 3.4 m median residual in the 12-16 m bucket. Without this limit every sample on that wall is AGAINST it -- a nearer surface -- and the one real wall in the corridor is REJECTED, which took the contract from WALL 35.9 s to WALL 5.9 s on the first replay of this check. 'Nothing to say' must never read as 'no wall'."
lidar_front_wall_wall_rect_reject_cycles:
  default: 3
  description: "Consecutive VERIFIABLE cycles (coverage >= lidar_front_wall_wall_rect_coverage_min) whose support is at or below the reject threshold before a track is REJECTED. VERIFIED stays immediate: verifying adds evidence for a wall the LiDAR already fitted, while rejecting TAKES THE WALL AWAY from every consumer, and one frame of a person, a reflection or a stale profile must not do that. Cycles where the rectangle had no coverage neither advance nor reset the count, so a wall that simply leaves the camera's view does not accumulate rejections. The rectangle's tolerance is NOT a parameter of its own: it is lidar_front_wall_wall_obs_tol_base_m + lidar_front_wall_wall_obs_tol_quad_per_m2 * d^2, the same model and the same two numbers the column cross-check uses, because a rectangle sample is the same measurement a column is, one pixel at a time."
lidar_front_wall_wall_tracker_scan_decimation:
  default: 4
  description: "The wall tracker processes one /scan in N; 1 is every scan. ONLY the tracker -- the node still publishes its WallLineFit and WallEstimate on every scan (that contract is in lidar_front_wall_node's own docstring), the estimator still fits every scan, and every OTHER /scan consumer is a separate process with its own subscription and is untouched: the behaviour tree's proximity e-stop, MPC_corr, swept_clearance_node, obstacle_clearance_node, wall_distance_node, front_clearance_node, slam_toolbox and nav2's obstacle layer all still receive 40 Hz. On a skipped scan the tracker's last verdict STANDS (it is a 10 Hz quantity published at the scan rate; flapping the contract three scans in four would be the worse lie). Deterministic by counter, not by clock, so a replay decimates identically. 4 is 10 Hz at the nominal 40 Hz scan rate, which is FASTER than the ~4 observations/s the node actually managed when it was CPU-bound (output/logger_check.md). Read the cycle-count thresholds -- confirm_hits, stereo_confirm_hits, wall_negative_miss_to_kill, wall_rect_reject_cycles -- against 10 Hz now: the table is in output/cpu/report.md."
lidar_front_wall_wall_extract_backend:
  default: "c"
  description: "Which implementation of the line extraction runs: \"c\" is corridor_perception_c's libextract_lines.so through ctypes, \"python\" is corridor_perception.extraction itself. The C is a PORT, not a reimplementation: tools/extract_backends_equiv.py runs both over all 2292 scans of corridor10m_20261015T171753 and gets the same segment count on every scan, the same per-gate drop counts, and a maximum difference of 7.1e-15 m on rho and the endpoints -- float64 summation order, nothing more. It costs 1.09 ms a scan p50 against the Python's 24.62 (22.5x), which on a box measured at 95-97 % CPU on 12 cores is the difference between the tracker fitting in its scan period and not. \"python\" is there to be the reference in an equivalence run and to be switched to if the C is ever suspected. If the library is absent the node logs ONE warning and runs the Python."
lidar_front_wall_camera_seg_min_ray_angle_deg:
  default: 25.0
  description: "RADIAL GATE (Q2, 2026-10-18), on every wall observation the camera had a hand in: the minimum angle between the segment's direction and the ray from the camera to its own midpoint. A surface lying along the ray is not observable -- one pixel of lateral error moves it metres -- and a column profile turns that into the 45 deg \"fans\" that litter /perception/walls. The LiDAR gates the same thing by incidence; the camera never did. Measured over corridor10m_20261016T144537's analysis window (output/wall_v2/q1/report.md): 437 of 536 stereo segments dropped, spurious segments per frame 0.932 -> 0.112, residual at 1.5-2.5 m unchanged (0.131 -> 0.134 m), median angle error 5.70 -> 2.46 deg. THE PRICE, deliberately accepted and measured, not discovered later: side-wall coverage falls 58.9 % -> 14.2 % (left) and 25.6 % -> 5.7 % (right), because a corridor wall seen from a car driving ALONG it is nearly radial by construction. If side walls matter more than spurious ones for a given mission, lower this. 0 disables the test. SYNTHETIC."
lidar_front_wall_camera_seg_min_bearing_span_deg:
  default: 3.0
  description: "The other half of the radial gate: the bearing span a camera segment must subtend from the camera. A segment under this is a handful of columns however well fitted, and its direction is noise. 3 deg at 640 px over a 101 deg field of view is about 19 columns. 0 disables it. SYNTHETIC."
lidar_front_wall_stereo_max_rms_m:
  default: 0.05
  description: "A STEREO-ONLY observation fitted worse than this is dropped. Nothing cross-checks a stereo-only line, so the bar is a shape the LiDAR could not plausibly have missed by accident. Not applied to LIDAR or BOTH, whose rms is already judged by the confidence model. SYNTHETIC."
lidar_front_wall_stereo_min_vertical_extent_m:
  default: 0.4
  description: "A STEREO-ONLY observation whose MEASURED wall points span less height than this is a kerb, a skirting board or a reflection edge, not a wall. Applied only when the height was actually measured (height_measured): a wall outside the columns the profile covers has no measured height and is not punished for it. SYNTHETIC."
lidar_front_wall_stereo_min_length_m:
  default: 0.8
  description: "Minimum length of a STEREO-ONLY observation, on top of the extraction's own span gates. Same reasoning as stereo_max_rms_m: a short unverified line is the one thing the camera invents most readily on this floor. SYNTHETIC."
lidar_front_wall_camera_confirm_fresh_only:
  default: true
  description: "Count a camera-only hit towards CONFIRMATION only on a cycle whose camera profile was fresh (age <= stereo_profile_max_age_s). The tracker runs at the scan rate and the camera at 5 Hz, so the same profile is re-presented over several cycles; without this, three cycles of one stale observation confirm a wall that was seen once. The track's STATE machine still runs on the ordinary hit, so a track does not start coasting merely because the camera was late. false restores the pre-2026-10-18 behaviour."
lidar_front_wall_camera_side_x_max_m:
  default: 4.0
  description: "Far edge of the x window a CAMERA-only track must reach to be called a side wall (the LiDAR keeps side_x_max_m). The camera's angular error grows with range where the LiDAR's does not, so the stretch a camera wall may speak for is shorter. SYNTHETIC."
lidar_front_wall_camera_side_max_normal_deg:
  default: 30.0
  description: "A CAMERA-only track's normal must be within this of the lateral axis to be a side wall, against the LiDAR's 45 deg. Tighter for the same reason as camera_side_x_max_m. SYNTHETIC."
lidar_front_wall_camera_side_offset_min_m:
  default: 0.3
  description: "A CAMERA-only side wall must sit at least this far from the car laterally. Nearer than this it is the chassis the camera sees in the lower right of its own image, which is the failure stereo_min_rho_m already guards from the other direction. SYNTHETIC."
lidar_front_wall_camera_side_offset_max_m:
  default: 3.0
  description: "And at most this far: beyond it the surface is the far side of a hall, not a wall the car is driving along, and calling it 'left' or 'right' invites a consumer to steer by it. SYNTHETIC."
lidar_front_wall_wall_conf_range_ref_m:
  default: 5.0
  description: "Range [m] at which wall_fusion.confidence's references (inlier_ref 40 returns, rms_ref 0.03 m) hold as written. Past it both are stretched by range / this value -- fewer returns expected, a looser fit tolerated -- because a planar LiDAR's returns on a surface thin out as 1 / range and its range noise grows with range, while the two references are absolute. Measured on corridor10m_20261016T144537: 71 % of the observations inside 1.5 m reach the FRONT gate's 0.5, 1 % of those at 12-18 m and 0 % past 18 m, with the 12-18 m band's rms the BEST in the bag (0.0156) -- the far wall was being refused for being far, not for being badly fitted. Nothing changes INSIDE this range, which is where cpu-cleanup R2 block 3's phantom (a FRONT built at 1.9-3.3 m from the faces either side of a corridor mouth) lives, so the phantom defence is untouched. 5 m is the far end of the near band where the nominal references were chosen. SYNTHETIC."
lidar_front_wall_wall_conf_min_inlier_ref:
  default: 8.0
  description: "Floor under the range-scaled inlier_ref (wall_conf_range_ref_m). Distance alone must never buy a wall: at 21 m the scaled reference is 9.5 returns and this floor binds past ~25 m, so a surface fitted from fewer returns than this still loses evidence for it. 8 is two above the extraction's own minimum run, i.e. the fewest returns anyone here calls a line. SYNTHETIC."
lidar_front_wall_wall_conf_max_rms_scale:
  default: 6.0
  description: "Cap on the range stretch applied to rms_ref, so the tolerated fit error saturates at 6 x 0.03 = 0.18 m rather than growing without limit. At the 20 m end of this LiDAR's usable range the stretch is 4.2, so the cap binds only past 30 m, where nothing in this stack tracks a wall anyway. It exists so a mis-stamped or mis-placed observation at 100 m cannot be scored as a tight fit. SYNTHETIC."
lidar_front_wall_wall_extract_quality_gates:
  default: true
  description: "Corridor_perception's extraction QUALITY GATES (extraction.py, WHY THE QUALITY GATES), on top of the point-count and length support filter: a range-dependent seed size N(r) = clip(3 + floor((r_med - 2.0) / 1.5), 3, 6) instead of a fixed 3, a perpendicular residual rms ceiling of 0.03 m applied AFTER the collinear merge, and an occlusion-aware fill ratio of 0.6 over the beams in the segment's own angular span. Steps 1-5 of the extraction only ask 'do these returns lie on a line?', and in a furnished room the answer is yes far too often: three returns on a chair leg are perfectly collinear, and the global merge will glue two unrelated 20 cm faces 1.4 m apart into one 1.5 m wall -- which is how a 1.39 m 'front wall' sat 2 m ahead of the car for 30 s of an EMPTY corridor (corridor10m_20261015T171753, track 8). FALSE restores the pre-gate extraction exactly, which is the only honest way to size what the gates change on a bag."
