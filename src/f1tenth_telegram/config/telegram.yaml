# f1tenth_telegram: the car (jetson-orin over Tailscale).
# No secrets here. The token lives in telegram.token_env_file, chmod 600.

target:
  name: Orin
  # ssh host as in ~/.ssh/config on linus (jetson-orin -> 100.96.201.7,
  # user fabiocar). 'local' runs f1tenth_ctl on this machine instead.
  host: jetson-orin
  # Key for BatchMode ssh; empty uses ~/.ssh/config and the agent.
  ssh_key: ~/.ssh/id_ed25519
  ssh_options: []
  connect_timeout_s: 5
  # f1tenth_ctl on whichever side of the car runs, the native Humble checkout
  # or the Jazzy container f1tenth_car: the wrapper
  # docker/orin/host/f1tenth_ctl_car, symlinked here by
  # docker/orin/host/install.sh. While f1tenth_car runs as the car it runs the
  # container's f1tenth_ctl (docker exec); while it runs as the D3 harness it
  # refuses; otherwise it runs the native
  # ~/dev_ws/f1tenth_more/src/f1tenth_ctl/bin/f1tenth_ctl. No build or ROS
  # sourced needed (non-interactive ssh does not read ~/.bashrc). Deploy this
  # config only after install.sh ran on the car (plan P8).
  ctl_command: ~/.local/bin/f1tenth_ctl_car
  # --env for f1tenth_ctl; empty = that side's own (native config/ctl.env,
  # the container's ctl_container.env). Keep it empty with the wrapper.
  ctl_env:
  ping: true

# Per command, ssh included.
timeouts_s:
  default: 20
  reach: 8
  status: 12
  connect: 25
  start: 30
  stop: 30
  killall: 75
  estop: 15
  # Abort + restart of behavior + check: ~10 s; a full stack restart: minutes.
  estop_reset: 240

telegram:
  # Numeric Telegram user ids allowed to use the bot. Empty: everyone is
  # ignored (and logged with their id, which is one way to find yours).
  allowed_user_ids: [857433485]
  # Messages older than this are dropped; confirmations expire after it.
  max_command_age_s: 10
  token_env_file: ~/.config/f1tenth_telegram/env
  # Bot API networking. IPv6 is broken on linus (getMe timed out; curl -6
  # fails, curl -4 answers in 0.2 s): connect over IPv4 only.
  force_ipv4: true
  # Connect, read, write and pool timeout of every Bot API request, seconds.
  timeout_s: 20

# Voice messages: transcribed here on linus (faster-whisper), then the same
# two steps as a typed command. The audio is deleted right after.
transcription:
  enabled: true
  # medium: the 2026-10-20 Italian check had small get the verb wrong in 2 of
  # 3 test commands ("vai dritto" -> "ma hai detto"), medium in 1. small uses
  # ~0.7 GB VRAM / 0.8 GB RAM, medium ~2 GB / 2 GB (README.md).
  model: medium
  # auto: CUDA float16 if it works (needs the venv's nvidia-* wheels), else CPU int8.
  device: auto
  # A Whisper language code, or auto.
  language: it
  max_duration_s: 60
