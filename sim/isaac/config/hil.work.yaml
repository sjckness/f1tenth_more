# hil.work.yaml - the HIL config of the WORK machine (DESKTOP-Q3F81S6, Isaac 5.1 native on Windows,
# RTX 4090), committed so that a fresh checkout there runs without a hand-written hil.local.yaml.
# Selected by F1T_HIL_CONFIG=hil.work.yaml (scripts/sim/win/hil_win_env.bat sets it unless the
# variable is already set). Same keys as hil.yaml; the values are the work's own, recovered from
# its hil.local.yaml (copy on the Orin, ~/dev_ws/f1tenth_hil/sim/isaac/config/hil.local.yaml,
# 2026-11-11) and checked on 2026-11-23 (WORK_FINDINGS.md B.4: ssh to 192.168.200.11 with the key).
#
# Only the workstation side reads it: the batch (hil_office_batch.py) hands the Orin side the
# addresses it needs on the car-hil command line, so the Orin has no copy of this file.
link:
  workstation_ip: 192.168.200.2    # "Ethernet 2" (Intel X710) of the work
  orin_ip: 192.168.200.11          # eno1 of the Orin, second address
  prefix: 24
  workstation_iface: ''
  orin_iface: ''
  speed_mbit: 1000
  socket_buffer_mb: 16
  async_writer: false
  flow_mbit: 800
ros:
  domain_id: 44
  rmw: rmw_fastrtps_cpp
  discovery_server_host: orin
  discovery_server_port: 11812     # not 11811: the car container's own server may be up
sim:
  isaac_dir: sim/isaac
  image: f1tenth_isaac:5.1.0       # unused on Windows (Isaac runs native from F:\envs\isaac)
  container: f1t_isaac_hil
  world: office
  layout: door_left
  gui: false
  stereo:
    width: 640
    height: 360
    rate: 10.0
    right_camera: false
  extra_set: []
orin:
  ssh: fabiocar@192.168.200.11     # the cable, not the Tailscale alias: Tailscale is not usable from this Windows account
  repo: ''                         # unused by the batch: the Orin side is ~/.local/bin/car-hil (scripts/car/deploy.sh)
  container: f1tenth_hil
  image: ''                        # unused by the batch: car-hil uses the image pinned by f1t deploy
  stack_args: ''
  require_host_network: true
wsl:
  distro: Ubuntu-24.04
