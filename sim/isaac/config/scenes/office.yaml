# office: the MAIN HIL world - the husarion office, the SAME Gazebo world the stack's Gazebo sim
# runs (src/f1tenth_sim/worlds/husarion_office_2x.sdf, the 2x-scaled copy of
# src/husarion_gz_worlds/worlds/husarion_office.sdf, Apache-2.0, submodule pinned at 87271ef).
#
# The SDF is the single source of truth. tools/sdf_to_usd.py converts it (meshes through Isaac's
# asset converter, world structure authored from the SDF) into usd/generated/office/office.usd,
# which usd/office_hil.usda references. Isaac Sim 5.1 has no SDF importer - see that script's
# header for what it does and why. Regenerate after any change to the SDF so Gazebo and Isaac
# never drift apart.
#
# MEASURED FROM THE SDF (tools/sdf_to_usd.py --plan, tools/pick_spawn_poses.py, 2026-11-10):
#   99 models, 157 visual + 148 collision geometries, 47 unique meshes, 210 k triangles
#   extent 28.5 x 27.1 x 2.6 m, floor at z = 0, walls 2.5 m
#   every structural model (Surfaces, Door, Glass_wall_1/2) has collision geometry
#   573 m2 of drivable floor at the lidar plane (z 0.05..0.35)
# Light enough for an RTX 5050 at 210 k triangles; --light (sdf_to_usd.py) drops the VISUAL
# meshes of the furniture and keeps every collider, if the textures turn out to be the problem.
name: office
type: usd_environment
environment:
  usd: usd/office_hil.usda       # repo-relative, resolved next to this sim directory
  # The SDF already carries 148 collision geometries and sdf_to_usd.py authors them as colliders.
  # Adding more here would give the lidar a SECOND copy of the world (the visual meshes).
  add_colliders: false
  collider_patterns: []
  vertical_colliders: {enabled: false, approximation: {}}
  audit_radius: 15.0             # tools/office_colliders.py / tools/lidar_passthrough.py ring
  hide_patterns: []              # GPU budget: e.g. ['*laptop*', '*tv*'] (prim-name patterns)
  labels:                        # prim-name patterns (fnmatch, lower case) -> semantic class
    floor: ["floor_*"]           # Surfaces/floor_1..floor_14
    wall: ["wall_*"]             # Surfaces/wall_1..wall_2 (one mesh each, whole building)
    glass: ["glass_wall*"]       # Glass_wall_1, Glass_wall_2 (box geometry)
    door: ["*door*"]             # OpenRobotics/Door (leaf CLOSED in the SDF, see below)
lighting:
  # The SDF has one directional sun and relies on Gazebo's 0.8 ambient. Headless
  # RaytracedLighting has no indirect diffuse, so the interior needs fill lights: a dome plus one
  # sphere light over each start pose and along the corridor run.
  extra_dome_intensity: 400.0
  shadows: false
  sphere_lights:
    - {position: [16.8, 0.0, 2.4], intensity: 30000.0, radius: 0.15}     # corridor start
    - {position: [16.8, -4.0, 2.4], intensity: 30000.0, radius: 0.15}
    - {position: [16.8, -8.0, 2.4], intensity: 30000.0, radius: 0.15}
    - {position: [16.8, -12.0, 2.4], intensity: 30000.0, radius: 0.15}
    - {position: [15.4, -11.6, 2.4], intensity: 30000.0, radius: 0.15}   # open space
    - {position: [10.0, -19.4, 2.4], intensity: 30000.0, radius: 0.15}   # door approach
    - {position: [8.0, -19.4, 2.4], intensity: 25000.0, radius: 0.15}    # through the doorway
person:
  enabled: false                 # a standing extra; the world itself has no people at all
  usd: /Isaac/People/Characters/M_Medical_01/M_Medical_01.usd
  position: [16.8, -6.0, 0.0]
  face_car: true
  asset_yaw_offset_deg: 90.0
  yaw_deg: 0.0
  pose: arms_down
  arm_abduction_deg: 4.0
  collider: {radius: 0.175, height: 1.75}
people:
  # WALKING characters (sim/people.py), OFF by default. The SDF has NO <actor> and no people, so
  # there is nothing to map: these are added by us. Paths were checked against the SDF occupancy
  # grid (tools/pick_spawn_poses.py); the minimum clearance along each is in the comment.
  enabled: false
  usd: /Isaac/People/Characters/F_Business_02/F_Business_02.usd
  pose: arms_down
  asset_yaw_offset_deg: 90.0
  speed: 1.1
  collider: {radius: 0.175, height: 1.75}
  characters:
    - {path: [[17.0, -2.0], [17.0, -12.0]], speed: 1.1, phase: 0.0}    # corridor, min 0.80 m
    - {path: [[17.0, -12.0], [17.0, -2.0]], speed: 0.9, phase: 0.3}    # the other way, min 0.80 m
    - {path: [[14.0, -11.5], [16.5, -11.5]], speed: 0.9, phase: 0.5}   # open space, min 1.66 m
car:
  start: {x: 16.814, y: 0.946, z: 0.02, yaw_deg: -90.0}   # = the `corridor` layout
layout: corridor
presets:
  # COMPUTED FROM THE SDF, not chosen by eye: tools/pick_spawn_poses.py projects every collision
  # geometry onto the lidar plane (per triangle: the office's walls and floors are one mesh each)
  # and reads the poses off that grid. Re-run it after regenerating the world.
  corridor:        # long corridor, 24.85 m clear ahead, 1.25 m clear to each side
    car: {start: {x: 16.814, y: 0.946, z: 0.02, yaw_deg: -90.0}}
  door:            # 2.0 m in front of a 1.25 m DOORWAY at (8.064, -19.404), 6 m free beyond it,
                   # clearance 1.48 m at the start, 0.65 m minimum on the way in
    car: {start: {x: 10.064, y: -19.404, z: 0.02, yaw_deg: 180.0}}
  door_left:       # a RUN-UP that ends beside a door: 5 m straight along -x, then a 1.25 m
                   # DOORWAY at (11.464, -14.604) exactly 2.0 m to the car's LEFT -- the geometry
                   # "go straight 5m then enter the door on the left" needs, which no other preset
                   # has (`door` starts 2 m from its doorway, head on). Same width as `door`'s
                   # opening, so the detector sees the size it already drives at.
                   # Computed, not chosen by eye, from the same occupancy grid as the poses above
                   # (tools/pick_spawn_poses.py's doorways(), searched for a run-up by
                   # tools/find_door_runup.py --run 5 --side left): clearance 1.70 m at the start,
                   # 0.45 m minimum along the run, and 12.7 m still free past the arrival point --
                   # the margin matters because corridor_rrt plans a corridor
                   # rrt_corridor_length_drive_m (3.0 m) PAST the car and stops where that end is
                   # blocked (see rrt_target_retreat), so a wall just beyond the door would stall
                   # the drive phase before the door phase ever started.
    car: {start: {x: 16.464, y: -12.604, z: 0.02, yaw_deg: 180.0}}
  open_space:      # the largest free circle on the floor: 2.80 m clear in every direction
    car: {start: {x: 15.364, y: -11.554, z: 0.02, yaw_deg: 0.0}}
  people:          # corridor start + the three walking characters
    car: {start: {x: 16.814, y: 0.946, z: 0.02, yaw_deg: -90.0}}
    people: {enabled: true}

  # ---------------------------------------------------------------- office HIL campaign
  # One preset per mission of office_hil_campaign/prompts.yaml. Each carries
  # EVERYTHING that mission needs -- start pose, fill lights, people -- because the
  # scene is fixed at Isaac launch and the campaign therefore runs one Isaac session
  # per mission. The start poses and every number in the comments come from
  # sim/isaac/tools/office_missions.py (output/office_missions/report.txt), which walks
  # each move chain over the SDF's occupancy grid at the lidar plane.
  #
  # EACH ONE REPEATS THE WHOLE sphere_lights ARRAY, which looks redundant and is not:
  # apply_layout deep-merges mappings but REPLACES lists wholesale (sim/config.py's
  # _merge), so a preset that lists only its own two lights silently switches the other
  # seven off.
  #
  # WHY THE EXTRA LIGHTS AT ALL: headless RaytracedLighting has no indirect diffuse, and
  # office_missions.py reports M01's three waypoints 6.2-6.4 m from the nearest existing
  # light. Geometry is not the risk in this campaign, light is: a chair the car can reach
  # is useless if YOLO never sees it. These are a starting point, not a measurement --
  # raise them if /camera/detections stays empty (plan risk 1).
  campaign_ma:     # M01_door_left_chair: 2.6 m straight, then the 1.45 m doorway at
                   # (8.06, -13.10) 1.25 m to the LEFT, then ConfOfficeChairBlack5 at
                   # (3.85, -14.01), 4.0 m beyond it on a clear line of sight.
                   # It is the ONLY detectable doorway visible from the start, so
                   # enter_door side=left cannot pick another.
    car: {start: {x: 9.33, y: -15.87, z: 0.02, yaw_deg: 90.0}}
    people: {enabled: false}
    lighting:
      sphere_lights:
        - {position: [16.8, 0.0, 2.4], intensity: 30000.0, radius: 0.15}     # the 7 base lights
        - {position: [16.8, -4.0, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [16.8, -8.0, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [16.8, -12.0, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [15.4, -11.6, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [10.0, -19.4, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [8.0, -19.4, 2.4], intensity: 25000.0, radius: 0.15}
        - {position: [9.3, -13.3, 2.4], intensity: 30000.0, radius: 0.15}    # end of the straight leg
        - {position: [8.1, -13.1, 2.4], intensity: 30000.0, radius: 0.15}    # in the doorway
        - {position: [4.6, -14.0, 2.4], intensity: 30000.0, radius: 0.15}    # over the target chair
  campaign_ma_bright:  # campaign_ma with its three added lights at 60000: the RUNBOOK's fallback
                       # when no `chair` reaches /costmap/semantic_tracks from the start pose.
                       # A preset rather than an edit of campaign_ma, so hil_night.sh can switch
                       # unattended and the run notes name which scene a repetition ran in.
    car: {start: {x: 9.33, y: -15.87, z: 0.02, yaw_deg: 90.0}}
    people: {enabled: false}
    lighting:
      sphere_lights:
        - {position: [16.8, 0.0, 2.4], intensity: 30000.0, radius: 0.15}     # the 7 base lights
        - {position: [16.8, -4.0, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [16.8, -8.0, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [16.8, -12.0, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [15.4, -11.6, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [10.0, -19.4, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [8.0, -19.4, 2.4], intensity: 25000.0, radius: 0.15}
        - {position: [9.3, -13.3, 2.4], intensity: 60000.0, radius: 0.15}    # end of the straight leg
        - {position: [8.1, -13.1, 2.4], intensity: 60000.0, radius: 0.15}    # in the doorway
        - {position: [4.6, -14.0, 2.4], intensity: 60000.0, radius: 0.15}    # over the target chair
  campaign_mb:     # M02_wall_left_wall: 4.0 m west to 3 m from the wall, 90 deg left,
                   # 10.55 m south to 2 m from the far wall. NO perception at all -- no
                   # object, no door -- so this is the only mission of the three whose
                   # outcome does not depend on the renderer, and the smoke case.
                   # Base lighting unchanged on purpose: nothing has to be seen.
    car: {start: {x: 16.83, y: -9.87, z: 0.02, yaw_deg: 180.0}}
    people: {enabled: false}
  campaign_md:     # M03_person_door_right: the SAME start as campaign_mb plus a STATIC
                   # person at (11.63, -13.30), 2.23 m down the southbound leg, and the
                   # doorway light. After the turn that doorway (8.06, -13.10) is the only
                   # detectable one visible, at -67 deg, inside enter_door's right-hand
                   # 15-135 deg sector.
                   # SEPARATE FROM campaign_mb, not an option: this person stands ON M02's
                   # second leg and leaves 0.45 m to its left and 0.80 m to its right,
                   # against the 1.18 m the car needs to pass one, so M02 cannot be driven
                   # in this scene.
                   # A path of two IDENTICAL waypoints is how a people character stands
                   # still: sim/people.py's _at() returns pts[0] when the polyline length
                   # is 0. The prim still carries the `person` semantic label and still
                   # appears in /sim/ground_truth/objects, which is what the driver checks
                   # before sending the command.
    car: {start: {x: 16.83, y: -9.87, z: 0.02, yaw_deg: 180.0}}
    people:
      enabled: true
      characters:
        - {path: [[11.63, -13.30], [11.63, -13.30]], speed: 0.0, phase: 0.0}
    lighting:
      sphere_lights:
        - {position: [16.8, 0.0, 2.4], intensity: 30000.0, radius: 0.15}     # the 7 base lights
        - {position: [16.8, -4.0, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [16.8, -8.0, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [16.8, -12.0, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [15.4, -11.6, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [10.0, -19.4, 2.4], intensity: 30000.0, radius: 0.15}
        - {position: [8.0, -19.4, 2.4], intensity: 25000.0, radius: 0.15}
        - {position: [11.6, -13.3, 2.4], intensity: 30000.0, radius: 0.15}   # over the person
        - {position: [8.1, -13.1, 2.4], intensity: 30000.0, radius: 0.15}    # in the doorway
# NOT A DOORWAY: the world's one `Door` model is a CLOSED leaf (x 10.03..10.27, y -7.07..-6.02)
# and a flight of stairs stands 0.6 m in front of it (Stairs collision box x 10.72..10.93,
# y -7.41..-6.41, z 0.17..0.33). The `door` preset above uses a real opening in the wall instead,
# which is also what the door detector is written for (two jambs and a gap). To drive at the
# modelled door, regenerate without it: tools/sdf_to_usd.py --convert --drop-visual door is not
# enough (collision stays); remove the model from a COPY of the SDF.
semantics: {unlabeled: 0, floor: 1, wall: 2, person: 3, car: 4, glass: 7, door: 8}
expected:
  # tools/find_pose.py raycasts these on the workstation; fill in per layout after the first run.
  wall_ahead_range_from_base: 0.0
