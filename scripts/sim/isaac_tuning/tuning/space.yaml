# The declared tuning space of the night loop. NOTHING outside it: check_params.py rejects any
# key that is not here and any value outside [min, max]. Keys are the live ROS parameter names on
# the node (`node`); `via` says how run_scenario.py gets them there without touching
# stack_params.yaml (common.write_overlays):
#   launch_arg  -> sim_overlay_extra: component_supervisor_node.sim_component_args.navigation
#                  (mpc_corr.launch.py's own launch argument of that name; `launch_arg` if it differs)
#   node_param  -> a copy of config/sim/isaac.yaml with a `<node>: ros__parameters:` block
#                  (keys mpc_corr.launch.py does not set)
# Defaults are stack_params.yaml's on branch mpc-centerline-target (w_obs 200.0 there).
# Per-stage weights are multiplied by 7/20 = 0.35 inside the solver (`effective`); w_term is not.
parameters:
  mpc_w_obs:
    node: mpc_corr
    via: launch_arg
    default: 200.0
    min: 20.0
    max: 800.0
    effective_scale: 0.35
    note: obstacle soft cost per stage (probes ahead of the nose); must beat w_term inside the disc
  mpc_w_term:
    node: mpc_corr
    via: launch_arg
    default: 9.0
    min: 2.0
    max: 25.0
    effective_scale: 1.0
    note: terminal pull to the centerline lookahead point (never moved by obstacles)
  mpc_w_corr:
    node: mpc_corr
    via: launch_arg
    default: 3.5714
    min: 0.0
    max: 9.0
    effective_scale: 0.35
    note: stage cross-track to the corridor centreline (re-anchored on the car every rebuild)
  mpc_w_du_delta:
    node: mpc_corr
    via: launch_arg
    default: 8.33
    min: 2.0
    max: 23.81
    effective_scale: 0.35
    note: steering-rate cost (anti-oscillation)
  avoidance_margin:
    node: mpc_corr
    via: launch_arg
    default: 0.12
    min: 0.05
    max: 0.30
    stack_params_key: obstacle_safety_margin_m
    note: the obstacle disc margin, R = car_radius + this. The SCORE uses the shipped 0.12 (metrics.py)
  corr_half_width_start_m:
    node: mpc_corr
    via: node_param
    default: 0.64
    min: 0.45
    max: 0.90
    note: corridor half-width at the car end (far end x 2.3/1.3). There is NO obstacle-adaptive
      widening on this branch; this is the only width knob.
  # ---- more weights (mpc-dodge phase 3) ------------------------------------------------------
  mpc_w_psi:
    node: mpc_corr
    via: launch_arg
    default: 4.5
    min: 0.5
    max: 15.0
    note: terminal heading weight (not stage-scaled)
  mpc_w_v:
    node: mpc_corr
    via: launch_arg
    default: 4.2857
    min: 1.0
    max: 12.0
    effective_scale: 0.35
    note: per-stage speed tracking
  mpc_prediction_dt_s:
    node: mpc_corr
    via: launch_arg
    default: 0.1
    min: 0.1
    max: 0.2
    note: prediction step, N stays 20 (horizon 2.0-4.0 s); also moves the lookahead floor
  class_margin_unknown_m:
    node: semantic_layer_node
    via: class_margin
    class: unknown
    default: 0.0
    min: 0.0
    max: 0.25
    note: obstacle_class_margin_m['unknown'], added to every LiDAR-only disc (the car uses {person 0.5})
  mission_speed_mps:
    node: mission
    via: mission
    default: 0.5
    min: 0.4
    max: 0.7
    note: cruise speed of the straight mission (the scenario's own speed_mps when absent); 0.4 is the floor
  # ---- moving obstacles (mpc-dodge phase 2, mpc_controller/obstacle_motion.py) ---------------
  mpc_obs_vel_trust:
    node: mpc_corr
    via: node_param
    default: 0.0
    min: 0.0
    max: 1.0
    note: predicted discs p + alpha v t_k for v_valid obstacles; 0 = static (today)
  mpc_obs_wake_weight:
    node: mpc_corr
    via: node_param
    default: 0.0
    min: 0.0
    max: 600.0
    effective_scale: 0.35
    note: soft cost on the half-ellipse ahead of an approaching obstacle's motion; 0 = off
  mpc_obs_wake_horizon_s:
    node: mpc_corr
    via: node_param
    default: 1.0
    min: 0.3
    max: 2.0
    note: wake length in seconds of the obstacle's motion
  mpc_obs_vel_lead_s:
    node: mpc_corr
    via: node_param
    default: 0.0
    min: 0.0
    max: 0.4
    note: extra prediction time for perception latency (EMA lag ~0.2 s at 10 Hz)
  mpc_obstacle_side_mode:
    node: mpc_corr
    via: node_param
    default: fixed
    choices: [fixed, informed]
    note: the side rule (informed = velocity, came-from, space, fixed; latched per track)
  # ---- the return onto the line (mpc-dodge phase 2b, mpc_controller/lateral_return.py) --------
  corridor_lateral_reanchor:
    node: mpc_corr
    via: node_param
    default: true
    choices: [true, false]
    note: true = corridor through the car every rebuild (today); false = the move's line fixed in odom
  mpc_return_gain:
    node: mpc_corr
    via: node_param
    default: 0.0
    min: 0.0
    max: 4.0
    note: w_corr x (1 + gain min(1, |e| / 0.5)) while returning
  mpc_return_lookahead_ratio:
    node: mpc_corr
    via: node_param
    default: 0.0
    min: 0.0
    max: 5.0
    note: the return arc lands ratio * |e| ahead (0 = no arc, w_corr alone); below ~2 the arc is past full lock
  mpc_return_psi_scale:
    node: mpc_corr
    via: node_param
    default: 1.0
    min: 0.2
    max: 1.0
    note: heading weights x this at a large lateral error (overshoot allowed)
  mpc_return_max_heading_deg:
    node: mpc_corr
    via: node_param
    default: 35.0
    min: 20.0
    max: 40.0
    note: cap on the return's approach angle
  mpc_return_overshoot_max_m:
    node: mpc_corr
    via: node_param
    default: 0.15
    min: 0.05
    max: 0.3
    note: allowed overshoot; also caps the approach angle (R_min (1 - cos theta) <= this)
# Not tunable, but set for every run (the sim-vs-car difference is in PLAN.md's open questions):
fixed_node_params:
  semantic_layer_node:
    unknown_objects_mode: active   # LiDAR-only objects (the Isaac cylinders) reach mpc_corr
    semantic_track_velocity_enabled: true   # id + odom velocity on every Obstacle2D (inert while
                                            # mpc_corr's mpc-dodge flags are off)
# The night loop's targets (night_loop.py).
stop:
  screening_repeats: 3            # S1-S4 x 3 + S5 x 1 per candidate set
  confirm_repeats: 10             # S1-S4 x 10 for a candidate that passed screening
  margin_tolerance_m: 0.03        # a run is good if success and clearance >= R_safe_ref - this
  max_iterations: 40
