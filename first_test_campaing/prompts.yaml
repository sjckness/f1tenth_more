# Prompt table of the first test campaign -- the ONLY source of mission names.
#
# `text` must be byte-identical to what the planner receives: the recorder
# looks a test up by it when no --prompt-num is given, flags a
# prompt_text_mismatch when the two differ, and hashes it to check that
# repetitions of one prompt stay comparable. Edit a text and every earlier
# repetition of that prompt stops being comparable with the new ones.
#
# `expected_sequence` is a comment on purpose, not a field: it is the move
# sequence the translation metric will one day compare the plan against, in
# the planner's own vocabulary (llm/schemas/intent_v1.json: straight with
# guard distance|wall|front_object, turn left|right, go_to <class>).

# expected_sequence: []  (no LLM: run with test_campaign_trigger 0)
- prompt_num: 0
  mission: M00_calibration
  text: "calibration"
  success_criterion: "not scored; sensor and noise-floor checks"

# expected_sequence: [straight distance 3.0 m, stop]
- prompt_num: 1
  mission: M01_forward_3m
  text: "go ahead 3 meters"
  success_criterion: "stops at 3.0 m +- 0.15 m from start, lateral error < 0.2 m, no contact"

# expected_sequence: [straight until wall 0.5 m, stop]
#   the prompt names no distance: 0.5 m is the criterion, not something the
#   planner is told, so a different wall thresh is a translation finding
- prompt_num: 2
  mission: M02_approach_wall
  text: "approach the wall"
  success_criterion: "stops facing the wall at 0.5 m +- 0.2 m, no contact, no e-stop"

# expected_sequence: [go_to bottle, stop]
- prompt_num: 3
  mission: M03_bottle
  text: "go to the bottle"
  success_criterion: "stops within 0.5 m of the bottle, facing it, no contact"

# expected_sequence: [go_to person 1.0 m, stop]
- prompt_num: 4
  mission: M04_person
  text: "go to the person"
  success_criterion: "stops at 1.0 m +- 0.3 m from the person, no contact, no e-stop"

# expected_sequence: [straight until wall 1.0 m, turn left 90 deg, stop]
- prompt_num: 5
  mission: M05_turn_left_wall
  text: "turn left at 1m from the wall"
  success_criterion: "starts the left turn at 1.0 m +- 0.2 m from the wall, turns about 90 deg, no contact"
