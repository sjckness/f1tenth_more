health_topic_types:
  /odom: nav_msgs/msg/Odometry
  /sensors/core: vesc_msgs/msg/VescStateStamped
  /scan: sensor_msgs/msg/LaserScan
  /odometry/filtered: nav_msgs/msg/Odometry
  /ekf_global/odometry/filtered: nav_msgs/msg/Odometry
  /joint_states: sensor_msgs/msg/JointState
  /slam/map: nav_msgs/msg/OccupancyGrid
  /costmap/front_clearance: std_msgs/msg/Float32
  /perception/lidar_front_wall: f1tenth_messages/msg/WallLineFit
  /obstacle_clearance: std_msgs/msg/Float32
  /perception/swept_clearance/lidar: std_msgs/msg/Float32
  /perception/d_wall/segment: f1tenth_messages/msg/WallSegment
  /drive: ackermann_msgs/msg/AckermannDriveStamped
  /ackermann_drive: ackermann_msgs/msg/AckermannDriveStamped
  /mpc/input_status: diagnostic_msgs/msg/DiagnosticStatus
  /behavior/tree_status: f1tenth_messages/msg/BehaviorTreeStatus
  /diagnostics/system_status: f1tenth_messages/msg/SystemStatus
  /diagnostics/battery_status: f1tenth_messages/msg/BatteryStatus
health:
  localization:
    checks:
    - topic: /odometry/filtered
      max_age_sec: 0.5
      min_rate_hz: 30
      when_fresh:
        /odom: 0.5
    - topic: /ekf_global/odometry/filtered
      max_age_sec: 0.5
      min_rate_hz: 30
      when_fresh:
        /odom: 0.5
    - topic: /joint_states
      max_age_sec: 1.0
  slam:
    grace_sec: 30
    checks:
    - topic: /slam/map
      once: true
      launch_file: slam.launch.py
      when_fresh:
        /scan: 0.5
    - topic: /costmap/front_clearance
      max_age_sec: 0.5
      launch_file: costmap.launch.py
      when_fresh:
        /slam/map: .inf
        /ekf_global/odometry/filtered: 0.5
  lidar_front_wall:
    enabled_if:
      use_lidar: true
    checks:
    - topic: /perception/lidar_front_wall
      max_age_sec: 0.5
      when_fresh:
        /scan: 0.5
  obstacle_clearance:
    enabled_if:
      use_lidar: true
    checks:
    - topic: /obstacle_clearance
      max_age_sec: 0.5
      when_fresh:
        /scan: 0.5
  swept_clearance:
    enabled_if:
      use_lidar: true
    checks:
    - topic: /perception/swept_clearance/lidar
      max_age_sec: 0.5
      when_fresh:
        /scan: 0.5
  wall_distance:
    enabled_if:
      use_lidar: true
    checks:
    - topic: /perception/d_wall/segment
      max_age_sec: 0.5
  control:
    checks:
    - topic: /ackermann_drive
      max_age_sec: 0.5
      when_fresh:
        /drive: 0.5
  navigation:
    enabled_if:
      enable_nav2: false
    checks:
    - topic: /mpc/input_status
      max_age_sec: 1.5
    - topic: /mpc/input_status
      max_age_sec: 1.5
      expect:
        level:
        - 0
      when_fresh:
        /odometry/filtered: 0.5
  behavior:
    checks:
    - topic: /behavior/tree_status
      max_age_sec: 0.5
  diagnostics:
    checks:
    - topic: /diagnostics/system_status
      max_age_sec: 5.0
      launch_file: system_observer.launch.py
    - topic: /diagnostics/battery_status
      max_age_sec: 1.5
      launch_file: diagnostics_server.launch.py
    - topic: /diagnostics/battery_status
      max_age_sec: 1.5
      launch_file: diagnostics_server.launch.py
      expect:
        has_data:
        - true
      when_fresh:
        /sensors/core: 0.5
unwatched:
  calibrate_hardware: on demand, runs for about 2 minutes and exits.
  startup_sequence: on demand, a one-off steering sweep.
  intelligence: llama-server, not a ROS node; nothing to watch on the graph.
  dev_tools: foxglove_bridge is a super client and serves the operator; its failure
    is visible to the operator directly.
  hardware: no launch files in this harness run
  perception: no launch files in this harness run
