# Measurement probe for output/rust/heavy_msgs.md, not a port: subscribes to
# heavy topics with no-op callbacks (optionally touching every byte) and
# counts messages, so its CPU per message is rclrs transport + deserialization.
# COLCON_IGNORE: built by hand with cargo, in a shell with ROS sourced (ros-env
# compiles the message crates on AMENT_PREFIX_PATH):  cargo build --release
# rclrs / ros-env pinned as in src/rust (see src/rust/Cargo.toml, R0b).
[package]
name = "ingest_probe_rs"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rclrs = "=0.8.0"
ros-env = "=0.3.0"

[lints.rust]
unsafe_code = "forbid"
